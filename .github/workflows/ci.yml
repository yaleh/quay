name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # M120 (DIR-060): this step SPAWNS the `.ts` CLI bins as subprocesses
          # (cli.test.mjs et al.), which only Node >=23 runs natively. Bumped
          # 20 -> 24 (one version inside the unflagged strip-types range, with
          # headroom). This is the CI RUNNER version only — `engines` stays
          # >=20.0.0, and the distributed tarball's Node-20 floor is proven
          # separately by the dist-verify-node-floor job below.
          node-version: '24'
      - run: npm install
      - name: Run tests
        # ADR-019/DIR-109 (M173): canonical entrypoint — scripts/test.sh owns the test-file glob
        # and the concurrency default; this step no longer hand-writes its own copy of either.
        # The 3 live/conformance files (serve-github.test.mjs, provider-abi-conformance.test.mjs,
        # cli-edit-parity-conformance.test.mjs) now declare their own in-file skip condition
        # (opt-in via QUAY_TEST_LIVE_GITHUB=1, not set here) instead of being excluded by a
        # hand-written grep/glob pattern — this job reports them `skipped`, not silently absent.
        run: bash scripts/test.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # M120 (DIR-060): floor-verification. The distributed npm-pack tarball's `bin`
  # is dist/quay.js and MUST run on the DECLARED floor (Node 20) — native `.ts`
  # needs Node >=23, which is exactly the regression the real v0.3.5 release hit.
  # This mirrors release.yml's dist-verify-node-floor, but self-builds the
  # tarball (no GitHub Release exists on a push/PR). A hard, runnable check.
  dist-verify-node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm the runner is really on the declared floor (Node 20)
        run: node --version | grep -E '^v20\.'
      - name: Build the npm-pack tarball (build-dist.sh runs fine under Node 20)
        run: |
          npm install
          bash packages/quay/scripts/package.sh
      - name: Install the tarball on Node 20 and run its packaged bin
        run: |
          set -euo pipefail
          TGZ="$(ls -1t packages/quay/quay-*.tgz | head -1)"
          echo "Installing ${TGZ} on $(node --version)"
          npm install -g "${TGZ}"
          quay --help
          quay --version

  # M132 (exp5-M-VERSION-CHECK-CI): fail-closed version consistency gate.
  # Runs version-consistency-check.ts on every push; fails the build if any
  # of the 8 version-bearing artifacts has drifted from the unified version.
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version consistency across all artifacts
        run: node --experimental-strip-types scripts/version-consistency-check.ts
