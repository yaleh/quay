name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  # `workflow_dispatch` is not only a manual re-run of the push jobs: it is also the ONLY way to
  # reach the dispatch-gated jobs below (`cold-start-e2e`, `verify-plugin-channel-assertions`).
  # Those are milestone-cadence jobs (ADR-010), never per-push. This file — not a new workflow —
  # is their home because GitHub only dispatches a workflow that exists on the DEFAULT branch, and
  # ci.yml is the one workflow already there that a branch-side change to it can be dispatched
  # against (`gh workflow run ci.yml --ref <branch>`).
  workflow_dispatch:
    inputs:
      inject_failing_assertion:
        description: "Negative control for verify-plugin-channel-assertions: inject a defect the gate MUST flag"
        required: false
        type: boolean
        default: false
      build_ref:
        description: "Ref the verify-plugin-channel-assertions job builds the artifact from (empty = the dispatched ref)"
        required: false
        type: string
        default: ""

jobs:
  test:
    # 2026-09-16: moved off ubuntu-latest onto the self-hosted tokyo-alpha runner (128-core EPYC /
    # 246G, docker-based ephemeral runner registered via systemd --user gh-runner-quay.service on
    # that host). This job is the heavy one (full node --test suite) — the labeled box is a single
    # machine, not GitHub's fleet, so if it's ever offline this job queues indefinitely rather than
    # falling back to a hosted runner; revert this line to `ubuntu-latest` (and restore the pinned
    # `--test-concurrency=8` below) to fail back.
    runs-on: [self-hosted, tokyo-alpha]
    # 2026-09-15 真机实测：这个 job 曾经在 4 核 runner 上、`--test-concurrency=8` 显式覆盖下能在
    # 10 分钟内跑完；本轮实测（develop tip 017d4f8f4）静态检查阶段本身已通过，真正的 `node --test`
    # 阶段跑满整整 10 分钟被 GitHub 判超时中止（`The job has exceeded the maximum execution time of
    # 10m0s`）——套件本身在这几天里长出了大量新测试文件（driver-anchor / fan-in-queueing-model /
    # server-restart* / verification-marginal-return 等），10 分钟这个字面量已经不够。⛔ 不是回归，
    # 是套件规模增长追上了预算；把预算调宽，⛔ 不要把并发再往上堆（4 核 runner，堆并发只加剧争用，
    # 参见下面「Run tests」步骤自己的注释）。
    # 上面这段全部是 ubuntu-latest 4 核时代的记录，保留是因为回退时（见上）这个 25 分钟预算和
    # --test-concurrency=8 要一起恢复；tokyo-alpha 是 128 核，budget 留宽松值即可，不必收紧。
    timeout-minutes: 25
    # 2026-09-16 (gap-tokyo-alpha-runner-env-lacks-pyyaml-suite-red): the job DECLARES the locale it
    # runs the suite under instead of inheriting whatever the runner host happens to be. Two
    # order-sensitive assertions — plugin/test/test-file-snapshot.test.mjs and
    # plugin/test/develop-deliver-tgz-evidence-transport.test.mjs — compare against the ordering
    # their producers emit from `sort -u`, and GNU sort's collation is locale-dependent: under
    # en_US.UTF-8 (what the tokyo-alpha image exports) punctuation is ignored at the primary level,
    # so the same `sort -u` emits a DIFFERENT order than under C. A/B at one commit, same machine:
    # LC_ALL=C.UTF-8 ⇒ 27 pass / 0 fail; LC_ALL=en_US.UTF-8 ⇒ 25 pass / 2 fail. C.UTF-8 is also the
    # configuration the suite is written and was green against (ubuntu-latest runs it), so pinning
    # it here restores the tested configuration rather than inventing a new one.
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      # TZ (gap-suite-ambient-reds-block-all-code-landings, class 1). The runner image happens to be
      # UTC, so `outer-tick-log-check` was green here WITHOUT this line — but "the host is UTC" is a
      # property of ubuntu-latest, not a declaration of this workflow (硬规则 4 推论二), and it made
      # the timezone half of the fix invisible: pinning only the locale leaves that file at 25 pass /
      # 2 fail on any non-UTC host. Declared explicitly so scripts/test.sh's own pin and this one are
      # the same statement rather than one statement plus one silent reliance on the runner.
      TZ: UTC
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          # list-files=0 CI 根因 (2026-08-28): 默认浅克隆 (depth 1) 缺
          # test-group-downgrade-check 的 enforcement baseline 8ea050c7 → NOT-EVALUATED exit 2 →
          # scripts/test.sh --list-files 空输出 → test-coverage-check --selftest AC5 fail。
          # fetch-depth: 0 = 全量历史, baseline 存在, 守卫可评估。
          fetch-depth: 0
      - name: Materialize the `develop` ref the suite reads by name
        # Three checks resolve this repo's authoritative branch as a LOCAL ref named `develop`:
        # plugin/scripts/direct-to-develop-bypass-check.ts returns NOT-EVALUATED ("rev-list-unreadable")
        # when there is no local `develop` branch, and the two git-graph decoration tests count the
        # develop label in `git log --all --pretty=%D` — which renders `origin/develop` when only the
        # remote-tracking ref exists, so the label is counted ZERO times. `actions/checkout@v4` leaves
        # every branch except the checked-out one as remote-tracking, and this job is dispatched on
        # task branches / master as well as develop. Measured on a scratch clone driven by exactly
        # `git init` + fetch + `checkout -B` (checkout's own mechanism), at this commit: 3 test files
        # red without this step, 0 red with it. Same commit, same machine, only the ref set differs.
        run: |
          set -euo pipefail
          if git rev-parse --verify -q refs/heads/develop >/dev/null; then
            echo "develop is already a local branch ($(git rev-parse --short develop))"
          else
            git branch develop refs/remotes/origin/develop
            echo "created local develop -> $(git rev-parse --short develop)"
          fi
      - uses: actions/setup-node@v4
        with:
          # M120 (DIR-060): this step SPAWNS the `.ts` CLI bins as subprocesses
          # (cli.test.mjs et al.), which only Node >=23 runs natively. Bumped
          # 20 -> 24 (one version inside the unflagged strip-types range, with
          # headroom). This is the CI RUNNER version only — `engines` stays
          # >=20.0.0, and the distributed tarball's Node-20 floor is proven
          # separately by the dist-verify-node-floor job below.
          node-version: '24'
      - name: Install suite runtime prerequisites
        # This suite is NOT self-contained — the PRODUCT's own shell scripts shell out to
        # `python3 -c 'import yaml, ...'` (plugin/scripts/quay-init.sh, quay-launch.sh,
        # manager-start.sh, verify-deliver-coldstart.sh), and the tmux cross-session tests
        # (tmux-leak-scan / supervisor-observe) need a real tmux binary. The tokyo-alpha image ships
        # python3 WITHOUT PyYAML and no tmux at all: measured on run 35115599539 that reddened 25
        # test files / 74 assertions, every one of them describing the ENVIRONMENT rather than a
        # product defect (e.g. `ModuleNotFoundError: No module named 'yaml'` surfacing as
        # "quay-init must succeed", "profiles.yml must parse as YAML").
        # Provisioning lives HERE, in the reviewed workflow, and not on the runner host, so it is
        # reproducible (a rebuilt runner converges on the same environment), auditable (the change
        # is a diff), and cannot rot as "something someone installed once on that box".
        # ── 机器可读 marker（AC-282 载体臂；tasks/gap-ac282-runner-prereqs-already-present）──────
        # 每个前置的**每个「走通了」分支**各打印一行 `__PREREQ__ <name>=<state>`，由
        # ci-runs-collect.ts 的 `derivePrereqProvision` 从**本 job 自己的日志**里派生进载体记录。
        # 为什么必须有它：`already-present` 与 `installed-apt` 两个分支的 step conclusion **都是
        # `success`**，jobs API 也不给 per-step 时长 ⇒ 这个读数在 jobs API 那一层结构上不可派生。
        # ⛔ 「走不通」的 else 分支**不打印 marker**：那一格是「没走到任何一个状态」，让它落成
        # `absent`（一个独立取值：没评估成）而不是伪造一个状态；该分支本来就 `exit 1`。
        # ⛔ 措辞不作判据来源：marker 行是唯一的机器读数，散文行只是给人看的。
        run: |
          set -euo pipefail
          if python3 -c 'import yaml' >/dev/null 2>&1; then
            echo "python3 already has PyYAML ($(python3 -c 'import yaml; print(yaml.__version__)'))"
            echo "__PREREQ__ pyyaml=already-present"
          elif sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; then
            echo "installed PyYAML via apt (python3-yaml)"
            echo "__PREREQ__ pyyaml=installed-apt"
          elif python3 -m pip install --break-system-packages pyyaml; then
            echo "installed PyYAML via pip (apt unavailable)"
            echo "__PREREQ__ pyyaml=installed-pip"
          else
            echo "FAIL: could not provision PyYAML by apt or pip"
            exit 1
          fi
          if command -v tmux >/dev/null 2>&1; then
            echo "tmux already present ($(tmux -V))"
            echo "__PREREQ__ tmux=already-present"
          else
            sudo apt-get install -y -qq tmux
            echo "installed tmux ($(tmux -V))"
            echo "__PREREQ__ tmux=installed-apt"
          fi
          # procps (ps / pgrep): full-suite-runner.ts reads `pgrep -c -f 'full-suite-runner\.ts'`
          # to count its own concurrent runners, and the suite's process-reaper tests shell out to
          # `ps`. Measured on run 35125070795: `ps -o pid,stat,wcmd -p <live pid>` printed NOTHING
          # on this runner while `process.kill(pid, 0)` reported the pid alive — i.e. the tool is
          # absent, not the process. Its absence fails open in that one call site but is still an
          # undeclared prerequisite of the suite.
          if command -v pgrep >/dev/null 2>&1 && command -v ps >/dev/null 2>&1; then
            echo "procps already present ($(ps --version 2>&1 | head -1))"
            echo "__PREREQ__ procps=already-present"
          else
            sudo apt-get install -y -qq procps
            echo "installed procps ($(ps --version 2>&1 | head -1))"
            echo "__PREREQ__ procps=installed-apt"
          fi
      - name: Verify the suite's runtime prerequisites (fail-closed, enumerated)
        # Hard rule 3b: an unprovisioned runner must produce ONE honest failure naming what is
        # absent, never a pile of assertion failures inside unrelated test files that read as
        # product defects. Enumerated rather than boolean: every prerequisite is named and its own
        # state printed, and the step exits non-zero if any is missing.
        run: |
          set -uo pipefail
          fail=0
          check() {
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then printf 'ok      %s\n' "$label"
            else printf 'MISSING %s\n' "$label"; fail=1; fi
          }
          check "python3"           command -v python3
          check "python3 + PyYAML"  python3 -c 'import yaml'
          check "jq"                command -v jq
          check "tmux"              command -v tmux
          check "ps"                command -v ps
          check "pgrep"             command -v pgrep
          check "bash"              command -v bash
          check "git"               command -v git
          check "node >= 23"        node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 23 ? 0 : 1)'
          check "local develop ref" git rev-parse --verify -q refs/heads/develop
          echo "--- runner environment ---"
          echo "uid=$(id -u)  LC_ALL=${LC_ALL:-<unset>}  awk=$(command -v awk) [$(awk -W version 2>&1 | head -1)]"
          if [ "$fail" != 0 ]; then
            echo "FAIL: the runner is missing suite prerequisites named above"
            exit 1
          fi
          echo "PASS: every suite runtime prerequisite is present"
      # gap-ac281-develop-ci-test-job-wallclock-under-30s (GOAL-022 scope item 3 ②): `npm install`
      # measured 11 s of the test job on run 35225478541 (13:11:12Z→13:11:23Z, per-step timestamps
      # from the gh jobs API — per-step wall clock is NOT derivable from the carrier), the 3rd
      # largest step after `Run tests`. The runner container is EPHEMERAL (`--rm` + `EPHEMERAL=true`
      # in gh-runner-quay.service, see .github/runner/Dockerfile), so it starts with an EMPTY ~/.npm
      # on every job and re-downloads every tarball every time. Caching ~/.npm keyed on the
      # lockfile's hash removes the download half of that; `--prefer-offline` lets npm use a cached
      # tarball instead of revalidating it against the registry.
      # ⛔ `continue-on-error: true` is deliberate: the cache is an OPTIMIZATION, and a cache-service
      # outage must never turn a green suite red. `npm install` itself stays fail-closed, and its
      # resolution is unchanged — the lockfile is still authoritative (no version is floated).
      # ⛔ This does NOT remove the step: a runner whose image lacks a warm cache still installs
      # everything. The durable form of this fix is the runner IMAGE (bake ~/.npm into
      # quay-ci-runner), which needs a host-side rebuild on tokyo-alpha — out of a workflow's reach.
      - name: Cache the npm tarball cache (gap-ac281-develop-ci-test-job-wallclock-under-30s)
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install --prefer-offline --no-audit --no-fund
      - name: Test-coverage self-check (DIR-110/ADR-019 decision #4)
        # Early, cheap, fail-fast: catches the DIR-108 failure class (a real test file sitting on
        # `master`, invisible to scripts/test.sh's glob) BEFORE paying for the full suite below.
        # --selftest first (ADR-018 selfcheck-fixture pattern: proves the check itself still
        # actually detects an orphan, RED+GREEN), then the real run against this repo's own tree.
        run: |
          node --experimental-strip-types scripts/test-coverage-check.ts --selftest
          node --experimental-strip-types scripts/test-coverage-check.ts
      - name: Bootstrap .quay/config.yml (gap-config-yml-example-and-ci-bootstrap)
        # `.quay/config.yml` is gitignored (DIR-050, per-workspace) and has never had a committed
        # template — every long-lived local checkout has one only because it was hand-bootstrapped
        # once, years ago, and gitignored files never get removed by a re-clone. A bare
        # `actions/checkout@v4` (this job) has NO `.quay/config.yml` at all, which quay's own CLI/
        # web ("quay serve" reads it to pick a Provider) and several dozen test files' own
        # "walk upward looking for .quay/config.yml to find the repo root" helpers treat as fatal —
        # 2026-09-15 real-machine finding: this silently broke ~26 test files on every fresh
        # checkout (confirmed via a scratch `git clone` at the exact CI commit, reproducing the
        # exact CI failure locally). Copying the checked-in, version-controlled reference config
        # into place fixes this for CI AND matches what README's "Option B — from source" already
        # promises a human contributor (git clone + npm install, nothing about .quay/config.yml).
        run: cp .quay/config.yml.example .quay/config.yml
      - name: Run tests
        # ADR-019/DIR-109 (M173): canonical entrypoint — scripts/test.sh owns the test-file glob.
        # 2026-09-16 (gap-suite-not-robust-at-high-derived-concurrency): the `--test-concurrency=16`
        # cap is REMOVED — back to `default_test_concurrency()`'s host reading. The cap was a literal
        # that happened to equal the dev machines' core count (硬规则 4 推论二: a number that is
        # "equivalent to no limit" only on the box you happen to run it on), and it did not fix
        # anything: it hid three load-shaped defects that were real DEFECTS IN THE TESTS, each now
        # root-caused and fixed instead of capped around —
        #   • serve-board (and 11 sibling files) probed an ephemeral port on loopback, CLOSED it, and
        #     bound it later ⇒ `listen EADDRINUSE 0.0.0.0:44203` under concurrency; now every one of
        #     them binds `port: 0` once and reads the kernel's port off the live handle.
        #   • fan-in-execute-paths §⑧⑩ waited for a detached suite's exit marker against a 15 s (then
        #     60 s) wall-clock literal; now the wait is event-driven (`fs.watch` + the suite's own pid
        #     liveness) and the clock survives only as an explicitly-configurable hang-guard.
        #   • dead-code-after-return-check AC6 crashed (exit 1 == "violation found") when a listed
        #     .sh vanished between its walk and its read — the npm-pack/delivery-smoke path stages a
        #     mirror of `plugin/` INTO the source tree and `rm -rf`s it; a vanished file is now
        #     skipped and REPORTED instead of being indistinguishable from a violation.
        # Measured on this runner (self-hosted tokyo-alpha, 128 core) with the fixes: 5 consecutive
        # uncapped runs, 0 failed / 0 cancelled. The resource gate still applies here (scripts/test.sh
        # full-suite path) and is what protects this SHARED multi-user box from starting a full suite
        # into an already-loaded machine. The 3 live/conformance files
        # (serve-github.test.mjs, provider-abi-conformance.test.mjs,
        # cli-edit-parity-conformance.test.mjs) now declare their own in-file skip condition
        # (opt-in via QUAY_TEST_LIVE_GITHUB=1, not set here) instead of being excluded by a
        # hand-written grep/glob pattern — this job reports them `skipped`, not silently absent.
        # gap-split-or-commit-not-continuously-checked: scripts/test.sh itself now also runs the
        # whole-task-store split-or-commit scan (DIR-026) on every invocation — this job inherits
        # that via this same `bash scripts/test.sh` call; no separate CI job was added for it.
        run: bash scripts/test.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # M120 (DIR-060): floor-verification. The distributed npm-pack tarball's `bin`
  # is dist/quay.js and MUST run on the DECLARED floor (Node 20) — native `.ts`
  # needs Node >=23, which is exactly the regression the real v0.3.5 release hit.
  # This mirrors release.yml's dist-verify-node-floor, but self-builds the
  # tarball (no GitHub Release exists on a push/PR). A hard, runnable check.
  #
  # DIR-111/ADR-019 decision #5: this job IS this repo's "packaging e2e" category — it builds the
  # real distributable artifact, installs it, and runs it on the declared Node floor. It is
  # explicitly NOT a `node --test *.test.mjs` suite and is NOT covered by `scripts/test.sh`/the
  # `test` job above; a green `test` job run says nothing about whether packaging itself works.
  dist-verify-node-floor:
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319): the metered
    # ubuntu-latest gate refused to START this job on 2026-09-24 (annotation: "recent account
    # payments have failed"). The Node 20 FLOOR this job exists to prove is unaffected — it is
    # supplied by the actions/setup-node step below, NOT by the runner image (tokyo-alpha ships a
    # node v10 with no npm; every node/npm/npx invocation here is downstream of setup-node).
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # list-files=0 CI 根因 (2026-08-28): 默认浅克隆 (depth 1) 缺
          # test-group-downgrade-check 的 enforcement baseline 8ea050c7 → NOT-EVALUATED exit 2 →
          # scripts/test.sh --list-files 空输出 → test-coverage-check --selftest AC5 fail。
          # fetch-depth: 0 = 全量历史, baseline 存在, 守卫可评估。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm the runner is really on the declared floor (Node 20)
        run: node --version | grep -E '^v20\.'
      - name: Build the npm-pack tarball (build-dist.sh runs fine under Node 20)
        run: |
          npm install
          bash packages/quay/scripts/package.sh
      - name: Install the tarball on Node 20 and run its packaged bin
        run: |
          set -euo pipefail
          TGZ="$(ls -1t packages/quay/quay-*.tgz | head -1)"
          echo "Installing ${TGZ} on $(node --version)"
          npm install -g "${TGZ}"
          # gap-ac86 (2026-08-16): the npm-installed `quay` bin is a SYMLINK to dist/quay.js, and
          # the bundle's main-entry guard (packages/quay/bin/quay.ts:230) compares process.argv[1]
          # to import.meta.url — a symlink path never equals the realpath URL, so the CLI `run()`
          # is never reached via the symlink and `quay --version` prints nothing (exit 0). That
          # symlink/main-entry mismatch is a KNOWN latent defect (separate task; touches the CLI
          # source, outside this job). To make THIS floor check non-vacuous we resolve the realpath
          # and assert the bundled CLI ACTUALLY produces the version on the declared floor: a broken
          # tarball, a Node-20-unrunnable bundle, or a regression where --version emits nothing all
          # fail here (AC86 判据 能取假 — not just exit code, but real output).
          QUAY_BIN="$(command -v quay)"
          QUAY_REAL="$(node -p "require('fs').realpathSync(process.argv[1])" "${QUAY_BIN}")"
          echo "installed bin: ${QUAY_BIN} -> ${QUAY_REAL}"
          VERSION_OUT="$(node "${QUAY_REAL}" --version)"
          echo "quay --version on $(node --version): ${VERSION_OUT}"
          test -n "${VERSION_OUT}"
          node "${QUAY_REAL}" --help >/dev/null
          echo "dist-verify-node-floor OK: packaged bin runs and emits version on $(node --version)"

  # M132 (exp5-M-VERSION-CHECK-CI): fail-closed version consistency gate.
  # Runs version-consistency-check.ts on every push; fails the build if any
  # of the 9 version-bearing artifacts has drifted from the unified version.
  version-consistency:
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319) — same metered-runner
    # refusal; its node/npx come from the actions/setup-node step below.
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # list-files=0 CI 根因 (2026-08-28): 默认浅克隆 (depth 1) 缺
          # test-group-downgrade-check 的 enforcement baseline 8ea050c7 → NOT-EVALUATED exit 2 →
          # scripts/test.sh --list-files 空输出 → test-coverage-check --selftest AC5 fail。
          # fetch-depth: 0 = 全量历史, baseline 存在, 守卫可评估。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version consistency across all artifacts
        run: node --experimental-strip-types scripts/version-consistency-check.ts
      - name: Check delivery-manifest.json matches release.yml (gap-orphaned-check-scripts-not-wired)
        # This checker existed, was correct, and was never invoked anywhere — a real "designed but
        # never wired" gap (M-DIR119-C-CANARY, 2026-07-27). Static mode: validates manifest
        # well-formedness against release.yml's own declared artifacts — no network/token needed,
        # so it runs on every push/PR here. The `--ci` mode (real published-asset verification
        # against a live GitHub Release) needs a real release tag + GITHUB_TOKEN and is wired
        # separately into release.yml's post-publish jobs.
        run: node --experimental-strip-types scripts/delivery-manifest-check.ts

  # gap-cold-start-e2e-installs-from-a-copy-and-nothing-runs-it (2026-08-03): the EXECUTOR for the
  # cold-start e2e. Measured cost of `bash test/cold-start-e2e.sh --from-build` is ~102s wall-clock
  # (build ~3s + install + asserts + the then-required AC7 >=90s inner-state.sh window; the window
  # and the retired monitor were removed at gap-retire-inner-state-one-observer-targets-by-parameter,
  # so the job is cheaper now), so this is NOT a per-push
  # job — it is gated to workflow_dispatch (milestone-cadence: a human or milestone agent triggers
  # it at milestone/release boundaries, matching ADR-010's milestone e2e and CLAUDE.md's "packaging
  # e2e is not covered by scripts/test.sh" stance). Never passes --push to publish-dist-branch.sh
  # (AC10) — this job only builds + installs from the orphan commit, it does not release.
  cold-start-e2e:
    if: github.event_name == 'workflow_dispatch'
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319) — same metered-runner
    # refusal; `npm install` below runs on the setup-node-supplied node, not the image's.
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # list-files=0 CI 根因 (2026-08-28): 默认浅克隆 (depth 1) 缺
          # test-group-downgrade-check 的 enforcement baseline 8ea050c7 → NOT-EVALUATED exit 2 →
          # scripts/test.sh --list-files 空输出 → test-coverage-check --selftest AC5 fail。
          # fetch-depth: 0 = 全量历史, baseline 存在, 守卫可评估。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workspace deps (the build needs esbuild)
        run: npm install
      - name: Cold-start e2e (install the plugin from build artifacts, no --push)
        run: bash test/cold-start-e2e.sh --from-build

  # ── verify-plugin-channel-assertions (gap-release-workflow-definition-lags-one-release, AC4/P3) ──
  # WHY THIS JOB EXISTS. The channel gate `verify-plugin-channel-assertions` is the only gate on
  # `master`, and until now its ONLY executor was release.yml's `verify-plugin-channel` job — so the
  # gate first executed as part of a REAL release, and any change to it (or to release.yml) was
  # first exercised live. `release-cut`'s dispatch used to carry no `--ref` at all, which made that
  # unrecoverable: a `workflow_dispatch` with no `--ref` runs the DEFAULT BRANCH's copy, so a broken
  # gate could not even be fixed forward — the fix sits on a branch, the dispatch runs master, and
  # master only advances AFTER a green release (`release-cut.mjs` now passes `--ref` explicitly; see
  # AC1/AC2, and its preflight refuses a governing definition that differs from the tag's tree).
  # This job is the other half: the gate is now EXPLICITLY TRIGGERABLE on any ref, so it can be run
  # — and seen to pass or fail — before a release exists.
  #
  # ⛔ WHAT THIS JOB DOES *NOT* CLAIM. It does not claim "the channel is green". WHICH REF the
  # artifact is built from is an OPEN QUESTION of that task: `version-consistency` requires a
  # non-`-dev` version carrier, and a build from a non-`release/*` ref legitimately carries `-dev`,
  # so a RED reading on the dispatched ref is a REAL reading (the gate correctly refusing a dev
  # artifact), not a defect in this job. ⛔ No assertion was relaxed to make anything green here.
  #
  # NEGATIVE CONTROL (`-f inject_failing_assertion=true`): repoints the scratch project's
  # `.quay/plugin` at a decoy tree, so `project-pointer` MUST go FAIL and, because the gate exits
  # non-zero on any FAIL, the job MUST go red. This arm is what rules out "the job's colour is
  # wired to something other than the assertion verdicts".
  #
  # The install/build path is release.yml's `verify-plugin-channel` job verbatim (same canonical
  # builder `publish-dist-branch.sh`, extracted from the orphan commit with `git archive` — never a
  # `cp` of the working tree), minus the user-scope leg and the tag pin.
  verify-plugin-channel-assertions:
    if: github.event_name == 'workflow_dispatch'
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319) — same metered-runner
    # refusal as the sibling jobs; node/npm/npx and `claude` all come from the steps below
    # (tokyo-alpha's image node is v10 with no npm).
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Declared, not inherited (硬规则 4 推论二) — same reasoning as the `test` job above.
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          # `build_ref` (optional) makes the artifact come from a DIFFERENT ref than the one whose
          # ci.yml is running — the whole point of the input, since WHICH ref the gate is fed is an
          # OPEN QUESTION of this job's task: `version-consistency` demands a non-`-dev` version and
          # only a `release/*`-form ref yields one. ⛔ The input does NOT relax any assertion; it
          # changes the ARTIFACT under test. Empty ⇒ the dispatched ref.
          ref: ${{ inputs.build_ref || github.ref }}
          # publish-dist-branch.sh creates an orphan branch + a throwaway worktree off HEAD and
          # reads the whole tree; a shallow clone cannot serve that.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build the plugin subtree from this ref (canonical path, no push)
        run: bash plugin/scripts/publish-dist-branch.sh --branch plugin-channel-verify

      - name: Extract the built plugin from the orphan commit
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/plugin-channel-src"
          git archive plugin-channel-verify | tar -x -C "${RUNNER_TEMP}/plugin-channel-src"
          test -f "${RUNNER_TEMP}/plugin-channel-src/.claude-plugin/marketplace.json"
          test -f "${RUNNER_TEMP}/plugin-channel-src/bin/quay"

      - name: Install the Claude Code CLI (the plugin channel's own installer)
        run: npm install -g @anthropic-ai/claude-code

      - name: Register the built plugin as a marketplace and install it into a scratch project
        # A SCRATCH project, not this repository: installing quay into the very tree under test
        # would make the gate depend on the repo's own plugin state.
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          claude plugin marketplace add "${RUNNER_TEMP}/plugin-channel-src"
          claude plugin install quay@quay --scope project -y
          claude plugin list || true

      - name: Resolve the installed plugin cache directory
        id: installed
        # Fail closed if no cache entry carries the CLI entry point: "could not resolve" must not
        # read as "nothing to check" (硬规则 3b).
        run: |
          set -euo pipefail
          CACHE_ROOT="${HOME}/.claude/plugins/cache/quay/quay"
          test -d "$CACHE_ROOT" || { echo "ERROR: no plugin cache at ${CACHE_ROOT} — the install did not materialise." >&2; exit 1; }
          INSTALLED=""
          for d in "$CACHE_ROOT"/*/; do
            [ -f "${d}bin/quay" ] || continue
            INSTALLED="${d%/}"
          done
          test -n "$INSTALLED" || { echo "ERROR: no cache entry under ${CACHE_ROOT} carries bin/quay." >&2; ls -la "$CACHE_ROOT" >&2 || true; exit 1; }
          echo "installed plugin: $INSTALLED"
          echo "dir=${INSTALLED}" >> "$GITHUB_OUTPUT"

      - name: Init the scratch project from the installed plugin
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          test -d "$SCRATCH/.git" || git -C "$SCRATCH" init -q
          # `--test-command` is passed explicitly: `quay init` fails closed without a detectable
          # test command (gap-quay-init-…), and the scratch project has no package.json.
          CLAUDE_PLUGIN_ROOT="$INSTALLED" "$INSTALLED/bin/quay" init \
            --root "$SCRATCH" \
            --project scratch-project \
            --repo-root "$SCRATCH" \
            --test-command 'node --test' \
            --plugin-root "$INSTALLED"
          test -f "$SCRATCH/.quay/config.yml"

      - name: Start the drivers and the server, and probe the server over HTTP
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          QUAY_BIN="${INSTALLED}/bin/quay"
          for kind in promotion worker; do
            ( cd "$SCRATCH" && "$QUAY_BIN" driver start --kind "$kind" --root "$SCRATCH" ) || true
          done
          # `server start` (⛔ NOT a raw `serve &`): it spawns the host in its own
          # `quay-serve-*.scope`, which is exactly what the `serve-own-scope` assertion reads.
          PORT=$(( 20000 + RANDOM % 20000 ))
          ( cd "$SCRATCH" && "$QUAY_BIN" server start --only web,control --host 127.0.0.1 --port "$PORT" --root "$SCRATCH" )
          # ANY HTTP response proves the process is up; quay's cold start blocks its event loop for
          # ~10s, so "no answer yet" is not "failed" — retry instead of sampling once.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:${PORT}/" || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "serve answered HTTP ${code} after ${i}s on port ${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: the quay server did not answer any HTTP response within 60s." >&2
          cat "$SCRATCH/.quay/serve.log" >&2 || true
          exit 1

      - name: Negative control — inject a defect the gate MUST flag
        if: inputs.inject_failing_assertion
        # `project-pointer` compares the pointer's realpath against the verified install; pointing
        # it at a decoy makes that comparison FALSE by construction, so the assertion must go FAIL.
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          mkdir -p "${RUNNER_TEMP}/decoy-plugin"
          ln -sfn "${RUNNER_TEMP}/decoy-plugin" "$SCRATCH/.quay/plugin"
          echo "injected: .quay/plugin -> $(readlink -f "$SCRATCH/.quay/plugin") (verified install: ${INSTALLED})"

      - name: Verify the channel — project-scope assertions
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          node --experimental-strip-types plugin/scripts/verify-plugin-channel-assertions.ts \
            --installed "$INSTALLED" --project "$SCRATCH" --scope project

      - name: Stop the drivers and the server
        if: always()
        # Cleanliness, not correctness: a leftover driver would make the NEXT run's reading pass
        # for the wrong reason.
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          if [ -n "${INSTALLED:-}" ] && [ -x "${INSTALLED}/bin/quay" ]; then
            ( cd "$SCRATCH" && "${INSTALLED}/bin/quay" server stop --only web,control --root "$SCRATCH" ) || true
            for kind in promotion worker; do
              ( cd "$SCRATCH" && "${INSTALLED}/bin/quay" driver stop --kind "$kind" --root "$SCRATCH" ) || true
            done
          fi
