name: Publish plugin dist

# DIR-108/M172: keeps the built, self-contained quay Claude Code plugin (the
# esbuild bundle at plugin/vendor/quay/dist/quay.js + mirrored vendor assets)
# OUT of the master branch's git history while still giving external
# `/plugin install` a real, buildable-nowhere-but-here artifact to fetch.
#
# Triggers:
#   * a `v*` tag push (release) — rebuild + force-publish the dist-plugin branch;
#   * a push to `develop` that touches plugin-relevant sources — so the develop
#     three-layer flow keeps `/plugin install` fresh (AC93: the chain must be
#     actually triggerable in the develop flow, not only on release tags that
#     the flow never creates). Path-filtered so telemetry/task/orchestration-only
#     pushes do not rebuild the bundle;
#   * workflow_dispatch (manual) — used to seed/re-seed the branch outside a
#     release, and to prove this job actually works end-to-end without waiting
#     for a version tag.
#
# Each run runs plugin/scripts/sync-vendor.sh to produce a fresh build, then
# force-publishes the built `plugin/` subtree to the orphan `dist-plugin` branch
# (the gh-pages pattern — that branch's history is NOT meant to be
# merged/reviewed, only fetched).
#
# `.claude-plugin/marketplace.json`'s plugin source points at this branch
# (`{"source":"github","repo":"yaleh/quay","ref":"dist-plugin"}`), so a real
# `/plugin install quay` always pulls whatever this job most recently published
# — never source .ts, never a stale in-master committed bundle.

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
    paths:
      - 'plugin/**'
      - 'packages/**'
      - '.claude-plugin/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

jobs:
  publish-dist-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Build-time runner only (esbuild + TS -> JS). The distributed
          # bundle's own Node-20 floor is a property of the build output,
          # not of the node version doing the building.
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build + publish plugin/ subtree to the dist-plugin orphan branch
        run: bash plugin/scripts/publish-dist-branch.sh --push --branch dist-plugin --remote origin
