name: Publish plugin dist

# DIR-108/M172: keeps the built, self-contained quay Claude Code plugin (the
# esbuild bundle at plugin/vendor/quay/dist/quay.js + mirrored vendor assets)
# OUT of the master branch's git history while still giving external
# `/plugin install` a real, buildable-nowhere-but-here artifact to fetch.
#
# Trigger: workflow_dispatch (manual) ONLY — used to publish/re-publish the
# dist-plugin branch from a chosen ref.
#
# gap-github-actions-no-implicit-triggers (2026-09-14, human ruling): this
# workflow used to ALSO auto-run on every push to `develop` touching
# plugin-relevant paths, and on every `v*` tag push. Publishing the
# marketplace-installable plugin is no longer an implicit side effect of
# ordinary development commits or of cutting a version tag — it must be a
# separately, explicitly requested action, because an automatic republish can
# race an in-progress manual one (observed 2026-09-14: an auto-triggered run
# force-overwrote a manually-published fix mid-flight) and because a plain
# `git push` to develop should never have a GitHub-writing side effect on its
# own. Publish (or re-publish) explicitly whenever the marketplace build needs
# to reflect new develop state or a new release tag.
#
# Each run runs plugin/scripts/sync-vendor.sh to produce a fresh build, then
# force-publishes the built `plugin/` subtree to the orphan `dist-plugin` branch
# (the gh-pages pattern — that branch's history is NOT meant to be
# merged/reviewed, only fetched).
#
# `.claude-plugin/marketplace.json`'s plugin source points at this branch
# (`{"source":"github","repo":"yaleh/quay","ref":"dist-plugin"}`), so a real
# `/plugin install quay` always pulls whatever this job most recently published
# — never source .ts, never a stale in-master committed bundle.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build the plugin from"
        required: false
        default: "develop"
        type: string

jobs:
  publish-dist-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Build-time runner only (esbuild + TS -> JS). The distributed
          # bundle's own Node-20 floor is a property of the build output,
          # not of the node version doing the building.
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build + publish plugin/ subtree to the dist-plugin orphan branch
        run: bash plugin/scripts/publish-dist-branch.sh --push --branch dist-plugin --remote origin
