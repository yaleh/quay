name: Release

# QX-033 (experiment 4, iteration 9): closes CB-008 (no packaging/distribution).
# Manually triggered against an EXISTING version tag (v*). Builds a
# distributable npm pack artifact and publishes it to the GitHub Release for
# that tag.
#
# Approach: npm pack (Option B) — produces quay-<version>.tgz installable via
# `npm install -g quay-<version>.tgz`. No build toolchain required beyond Node.js.
#
# gap-github-actions-no-implicit-triggers (2026-09-14, human ruling): this
# workflow used to auto-run on every `v*` tag push. A tag push is no longer
# treated as an implicit "please publish" request — publishing must be
# triggered explicitly (workflow_dispatch, with the tag to release named
# as an input) so a plain `git push --tags` never has a GitHub-writing side
# effect on its own. `github.ref_name` (only meaningful for a ref-triggered
# run) is replaced throughout this file by the `tag` input.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. v0.6.3) — must already exist"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # gap-release-timeout-10min-cancels-npm-tgz (2026-08-16): the "Run tests" step
    # (96 deterministic test files across packages/quay + packages/quay-native) exceeded
    # the old `timeout-minutes: 10` on the v0.5.0 run (31958447040) — the job was
    # cancelled BEFORE "Build release artifact (npm pack)" / "Upload artifact to
    # GitHub Release" ran, so the npm .tgz was never auto-attached. Widen to 30 to give
    # cold runners + future test growth a comfortable margin (sea-release, which does
    # more build work, is already 15).
    timeout-minutes: 30
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          # M120 (DIR-060): the "Run tests" step below spawns the `.ts` CLI bins
          # as subprocesses, which only Node >=23 runs natively — bumped 20 -> 24.
          # RUNNER version only; `engines` stays >=20.0.0. The distributed
          # tarball's actual Node-20 floor is proven by dist-verify-node-floor.
          # (sea-release stays on '20' — its own separate build path.)
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # QX-056 (experiment 4, iteration 15): DIR-004 publish.
        # quay-github package tests are excluded (they require broader org perms) —
        # this job intentionally scopes to packages/quay + packages/quay-native only,
        # narrower than scripts/test.sh's default glob, so it does NOT delegate to
        # scripts/test.sh here.
        #
        # ADR-019/DIR-109 (M173): live-GitHub tests self-skip unless opted in via
        # QUAY_TEST_LIVE_GITHUB=1 (in-file `node:test` skip conditions in serve-github /
        # provider-abi-conformance / cli-edit-parity-conformance, and the same opt-in
        # gate on cli.test.mjs's live blocks 8/10/11).
        #
        # gap-release-postinstall-fallback-breaks-windows-sea-build (AC4): this step
        # deliberately does NOT set GH_TOKEN (nor QUAY_TEST_LIVE_GITHUB). The v0.4.0
        # release run set GH_TOKEN here, which ENABLED cli.test.mjs's live blocks against
        # the real yaleh/quay issue store — and those assertions drift with that store's
        # current state (E3 adr-001 / M52 delivery-standalone-smoke / AC5 real-store
        # scan failures in the same run), blocking the release on external state unrelated
        # to whether the tagged commit's deterministic tests pass. A release gate verifies
        # the ARTIFACT, not the live store's mutable state; the deterministic subset here
        # runs without the token. Live-GitHub conformance remains covered by the FULL suite
        # (scripts/test.sh / ci.yml) under QUAY_TEST_LIVE_GITHUB=1, where drift is triaged.
        run: node --test packages/quay/test/*.mjs packages/quay-native/test/*.test.mjs

      - name: Build release artifact (npm pack)
        id: pack
        run: |
          bash packages/quay/scripts/package.sh
          # npm pack produces quay-<version>.tgz where version has no 'v' prefix
          # (git tags use v0.1.0 but package.json version is 0.1.0 — the 'v' must be stripped)
          ARTIFACT=$(ls -1t packages/quay/quay-*.tgz 2>/dev/null | head -1)
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Built: ${ARTIFACT}"

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.artifact }}
          body: |
            ## quay ${{ inputs.tag }}

            Install globally with Node.js >= 20:

            ```sh
            # Download the .tgz from this release page, then:
            npm install -g quay-*.tgz
            quay --help
            quay serve
            ```

            The `.tgz` artifact attached to this release is produced by `npm pack` from `packages/quay/`.
            It includes all runtime dependencies (`@modelcontextprotocol/sdk`, `yaml`) and the CLI entrypoint (built as `dist/quay.js`).
            Note: the artifact filename uses the package version (e.g. `quay-0.1.0.tgz`), not the git tag (e.g. `v0.1.0`).

  # M01-dist (exp5, iteration 0): DIR-004 remaining scope — single-file
  # executables via Node SEA, requiring no separately-installed Node.js
  # runtime on the end user's machine. See packages/quay/scripts/build-sea.sh
  # and packages/quay-native/scripts/build-sea.sh for the build logic and why
  # BOTH packages need their own SEA binary (Core spawns the Provider's
  # mcp_entry as a child process; `quay serve` is not genuinely Node-free
  # unless mcp_entry also points at a SEA binary, not `node ...`).
  sea-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x64
          - os: macos-latest
            asset_suffix: macos-arm64
          - os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build quay (Core) SEA binary
        shell: bash
        run: bash packages/quay/scripts/build-sea.sh

      - name: Build quay-native (Provider) SEA binary
        shell: bash
        run: bash packages/quay-native/scripts/build-sea.sh

      - name: Assemble release bundle (both binaries + packaged .quay/config.yml + plugin sidecar)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="dist-sea-release"
          rm -rf "${BUNDLE_DIR}"
          mkdir -p "${BUNDLE_DIR}/.quay" "${BUNDLE_DIR}/tasks"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp packages/quay/dist-sea/quay.exe "${BUNDLE_DIR}/quay.exe"
            cp packages/quay-native/dist-sea/quay-native.exe "${BUNDLE_DIR}/quay-native.exe"
            MCP_ENTRY='["./quay-native.exe", "mcp"]'
          else
            cp packages/quay/dist-sea/quay "${BUNDLE_DIR}/quay"
            cp packages/quay-native/dist-sea/quay-native "${BUNDLE_DIR}/quay-native"
            MCP_ENTRY='["./quay-native", "mcp"]'
          fi
          # gap-release-sea-bundle-excludes-plugin-tree (AC16 产物层): the SEA archive is
          # the RECOMMENDED distribution — it must carry the plugin SIDECAR (the agent
          # surface that IS the self-evolving loop), staged by the Core build-sea.sh into
          # packages/quay/dist-sea/plugin/. Fail closed if it is missing (AC1: the release
          # artifact must contain plugin/).
          if [ -d "packages/quay/dist-sea/plugin" ]; then
            cp -R packages/quay/dist-sea/plugin "${BUNDLE_DIR}/plugin"
            echo "Included plugin sidecar: ${BUNDLE_DIR}/plugin ($(find "${BUNDLE_DIR}/plugin" -type f | wc -l | tr -d ' ') files)"
          else
            echo "ERROR: packages/quay/dist-sea/plugin not found — the SEA archive would ship without the plugin bundle (AC1 unmet)." >&2
            exit 1
          fi
          cat > "${BUNDLE_DIR}/.quay/config.yml" <<EOF
          # Packaged config for the SEA/single-file-executable distribution
          # (M01-dist). Both quay and quay-native are compiled Node SEA
          # binaries placed side-by-side in this directory; mcp_entry
          # invokes the sibling binary directly (no node on PATH required).
          providers:
            native:
              enabled: true
              path: "."
              tasks_dir: "./tasks"
              mcp_entry: ${MCP_ENTRY}
              env:
                QUAY_NATIVE_TASKS_DIR: "./tasks"
          EOF

      - name: Archive release bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/quay/package.json').version")"
          ARCHIVE_NAME="quay-sea-${VERSION}-${{ matrix.asset_suffix }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # M122 fix (exp5-DEFECT-SEA-VERIFY-SINGLE-PLATFORM-ONLY): bash's bare `*` glob does NOT
            # match dotfiles/dotdirs, so `./dist-sea-release/*` silently excluded `.quay/config.yml`
            # (and `.quay/` itself) from every Windows SEA archive — the archived bundle looked
            # complete (quay.exe/quay-native.exe present) but `quay serve`/most commands crashed at
            # runtime with "no .quay/config.yml found", a real latent bug never caught because no
            # runtime-smoke job ever ran the Windows archive before this milestone. `shopt -s dotglob`
            # makes `*` match dotfiles too, matching tar's `-C dist-sea-release .` behavior below.
            shopt -s dotglob
            7z a "${ARCHIVE_NAME}.zip" ./dist-sea-release/*
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist-sea-release .
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      # gap-release-artifact-missing-plugin-ac16 (AC3 产物层验证): extract the archive THIS job just
      # built and run the mechanical artifact-level check (verify-sea-artifact.sh) — plugin/ sidecar
      # present and non-empty AND all 6 mechanism names (dead-loop-check/verify-delivery-surface/
      # slot-refill/claim-task/self-report-vocab/laydown-set-check) reverse-searchable in the
      # artifact. This is the exact check archguard report #13 ran against v0.4.0 and found failing
      # (strings of the 6 names: 0 hits; no plugin/ in the archive). Fail-closed BEFORE upload: a
      # release artifact that would regress AC16 (artifact-level delivery) never reaches consumers.
      - name: Verify the release archive carries the plugin sidecar (AC3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive-check
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z x "${ARCHIVE_PATH}" -oarchive-check >/dev/null
          else
            tar -xzf "${ARCHIVE_PATH}" -C archive-check
          fi
          bash packages/quay/scripts/verify-sea-artifact.sh archive-check

      - name: Upload SEA archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          body: |
            ## quay ${{ inputs.tag }} — single-file executables (Node SEA)

            Platform-specific archives (`quay-sea-<version>-<platform>.{tar.gz,zip}`)
            are the **recommended distribution**: two single-file executables (`quay`,
            `quay-native`) plus a packaged `.quay/config.yml` wiring them together, AND
            the full `plugin/` sidecar (the agent surface that IS the self-evolving
            loop) — no separately installed Node.js runtime required. Extract the
            archive and run:

            ```sh
            ./quay --help
            ./quay serve
            ```

            Architecture decision (gap-release-sea-bundle-excludes-plugin-tree AC3):
            the plugin ships as a **sidecar directory inside the same archive** (not
            embedded into the SEA single-file binary — the plugin is a tree of
            .sh/.ts/markdown that needs Node+shell at runtime, so embedding would force
            a runtime unpack with no benefit). `quay-init --loop` (in `plugin/scripts/`)
            lays the plugin's mechanisms into a target workspace.

  # Independent verification job (M01-dist Done-when clause 4, it0
  # domain-misfit audit-channel): downloads the Linux SEA archive this same
  # workflow run just published and runs it in a container image that has
  # never had Node.js installed, proving the executable is genuinely
  # Node-free end-to-end — not just "the build succeeded".
  sea-verify-node-free:
    needs: sea-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:stable-slim
    steps:
      - name: Install runtime deps (libatomic1; explicitly NOT nodejs, NOT gh)
        run: |
          apt-get update -qq
          apt-get install -y -qq libatomic1 curl tar
      - name: Confirm no Node.js is present in this verification shell
        run: |
          if command -v node >/dev/null 2>&1; then
            echo "ERROR: node is present — this job does not prove Node-free operation." >&2
            exit 1
          fi
          echo "Confirmed: no node on PATH."
      - name: Download the SEA archive published by sea-release (this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # M01-dist iteration-1: `gh` (the GitHub CLI) is preinstalled on
          # ubuntu-latest HOST runners but is NOT present in a bare
          # debian:stable-slim `container:` job — a real "command not found"
          # (exit 127) was hit here, not assumed. Use the GitHub REST API
          # directly via curl instead, which only needs curl (already
          # installed above) and keeps this job's dependency footprint
          # minimal (no extra apt repo for `gh`).
          #
          # This repo is PRIVATE (confirmed: `gh api repos/.../ --jq .private`
          # -> true), so a plain GET of the release's `browser_download_url`
          # returns 404 even with a valid bearer token (verified directly,
          # exit 22/HTTP 404) — private-repo release assets require the
          # dedicated assets API endpoint with an octet-stream Accept header,
          # not the public web download URL. Fetch the asset id from the
          # release-by-tag API, then GET
          # /releases/assets/{id} with Accept: application/octet-stream.
          VERSION="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          ASSET_NAME="quay-sea-${VERSION}-linux-x64.tar.gz"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ inputs.tag }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          mkdir -p extracted
          tar -xzf "${ASSET_NAME}" -C extracted
      # gap-release-artifact-missing-plugin-ac16 (AC3): the DOWNLOADED consumer-facing asset must
      # carry the plugin sidecar + all 6 mechanism names — the exact regression archguard #13 found
      # (v0.4.0 archive had only quay/quay-native binaries, no plugin/). This container has no repo
      # checkout, so the canonical verify-sea-artifact.sh is not available; this is an inline mirror
      # of its checks (keep the 6-name list in sync with packages/quay/scripts/verify-sea-artifact.sh).
      - name: Verify the downloaded archive carries the plugin sidecar (AC3)
        run: |
          set -euo pipefail
          cd extracted
          if [ ! -d plugin ] || [ -z "$(find plugin -type f 2>/dev/null | head -1)" ]; then
            echo "ERROR: downloaded SEA archive has no non-empty plugin/ (AC16 regression)." >&2
            exit 1
          fi
          for m in dead-loop-check verify-delivery-surface slot-refill claim-task self-report-vocab laydown-set-check; do
            if ! grep -rlF -- "$m" . 2>/dev/null | grep -q .; then
              echo "ERROR: mechanism '$m' not reverse-searchable in the downloaded artifact." >&2
              exit 1
            fi
          done
          echo "OK: downloaded SEA archive carries plugin/ + all 6 mechanism names (AC3)"
      - name: Run quay --help (no Node on PATH)
        run: |
          cd extracted
          chmod +x ./quay ./quay-native
          ./quay --help
      - name: Run quay serve and curl it (no Node on PATH)
        run: |
          cd extracted
          ./quay serve --port 18080 &
          SERVE_PID=$!
          sleep 2
          curl -sf -o /dev/null -w "http_code:%{http_code}\n" http://localhost:18080/
          kill "$SERVE_PID"

  # M122 (exp5-DEFECT-SEA-VERIFY-SINGLE-PLATFORM-ONLY): the macOS/Windows counterpart to
  # sea-verify-node-free above. GitHub Actions `container:` (the Linux job's Node-free technique)
  # only supports Linux runners — macos-latest/windows-latest images ship Node.js preinstalled with
  # no container isolation available. Proves Node-freeness instead by explicitly stripping every
  # PATH directory containing a `node`/`node.exe` binary before running the SEA binary, then
  # confirming `command -v node` genuinely fails under that stripped PATH (same standard of evidence
  # as the Linux job's "no node on PATH" check, achieved by a different mechanism appropriate to
  # runners that can't be containerized).
  sea-verify-node-free-cross-platform:
    needs: sea-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_suffix: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            asset_suffix: windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Download the SEA archive published by sea-release (this run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same private-repo assets-API fetch technique as sea-verify-node-free above (the public
          # browser_download_url 404s on a private repo even with a valid token).
          VERSION="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          ASSET_NAME="quay-sea-${VERSION}-${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ inputs.tag }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          mkdir -p extracted
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z x "${ASSET_NAME}" -oextracted >/dev/null
          else
            tar -xzf "${ASSET_NAME}" -C extracted
          fi
      - name: Strip Node.js from PATH and confirm it is genuinely gone
        shell: bash
        run: |
          set -euo pipefail
          STRIPPED_PATH="$(printf '%s' "$PATH" | tr ':' '\n' | while IFS= read -r d; do
            if [ -x "$d/node" ] || [ -x "$d/node.exe" ]; then
              continue
            fi
            printf '%s\n' "$d"
          done | paste -sd: -)"
          echo "STRIPPED_PATH=${STRIPPED_PATH}" >> "$GITHUB_ENV"
          if PATH="${STRIPPED_PATH}" command -v node >/dev/null 2>&1; then
            echo "ERROR: node is still present under the stripped PATH — this job does not prove Node-free operation." >&2
            exit 1
          fi
          echo "Confirmed: no node on the stripped PATH."
      - name: Run quay --help (no Node on stripped PATH)
        shell: bash
        run: |
          cd extracted
          chmod +x ./quay ./quay-native 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PATH="${STRIPPED_PATH}" ./quay.exe --help
          else
            PATH="${STRIPPED_PATH}" ./quay --help
          fi
      - name: Run quay serve and curl it (no Node on stripped PATH)
        shell: bash
        run: |
          cd extracted
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PATH="${STRIPPED_PATH}" ./quay.exe serve --port 18081 &
          else
            PATH="${STRIPPED_PATH}" ./quay serve --port 18081 &
          fi
          SERVE_PID=$!
          sleep 2
          curl -sf -o /dev/null -w "http_code:%{http_code}\n" http://localhost:18081/
          kill "$SERVE_PID"

  # M120 (DIR-060): floor-verification for the npm-pack tarball. Mirrors
  # sea-verify-node-free's asset-fetch shape (download the asset THIS run just
  # published, private-repo assets API), but keeps Node PRESENT and PINNED to
  # the declared floor (Node 20) — the point is proving the distributed `bin`
  # (dist/quay.js) runs on Node 20, the exact regression the real v0.3.5 release
  # hit (native `.ts` needs Node >=23). The hard, runnable guard that would have
  # caught it before a release attempt did.
  dist-verify-node-floor:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm the runner is really on the declared floor (Node 20)
        run: node --version | grep -E '^v20\.'
      - name: Download the npm-pack tarball published by release (this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same private-repo asset-fetch path as sea-verify-node-free: the
          # public browser_download_url 404s on a private repo, so resolve the
          # asset id from the release-by-tag API and GET the assets endpoint
          # with an octet-stream Accept header.
          VERSION="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          ASSET_NAME="quay-${VERSION}.tgz"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ inputs.tag }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
      - name: Install the published tarball on Node 20 and run its packaged bin
        run: |
          set -euo pipefail
          VERSION="$(echo "${{ inputs.tag }}" | sed 's/^v//')"
          echo "Installing quay-${VERSION}.tgz on $(node --version)"
          npm install -g "quay-${VERSION}.tgz"
          quay --help
          quay --version

  # gap-orphaned-check-scripts-not-wired (M-DIR119-C-CANARY, 2026-07-27): delivery-manifest-check.ts
  # was real, correct, and never invoked anywhere. `ci.yml` now runs its STATIC mode (no network) on
  # every push; this job runs its `--ci` mode — the one that needs a real published GitHub Release
  # tag + token to cross-check delivery-manifest.json's declared artifacts against what THIS release
  # run actually published — the genuine end-to-end verification the static mode cannot do.
  delivery-manifest-verify:
    needs: [release, sea-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify delivery-manifest.json against this release's real published assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/delivery-manifest-check.ts --ci

  # ── advance-master (orchestration/SPEC-release-and-hotfix-branching-2026-09-15.md §6.1) ────────
  # master is redefined as "the tag of the most recent FULLY GREEN release run" and is advanced by
  # exactly this one event — never by a direct commit. This job is that event. It exists because
  # before it, nothing in this repo moved master at all: measured 2026-09-15, master was frozen at
  # 9316b797d (2026-08-03) while develop ran ~19.6k commits ahead, and no workflow, script or task
  # contained the name `advance-master` — the mechanism the human ruling named (§1 ⑤ 问 3, option A)
  # had zero implementation.
  #
  # THREE INVARIANTS (§6.1), each carried by a MECHANISM rather than by review:
  #   1. any dependency not fully successful ⇒ master does not move. That is GitHub Actions' own
  #      `needs:` semantics (a job whose dependency did not succeed is SKIPPED), so fail-closed is
  #      the default here, not code that could be forgotten.
  #   2. fast-forward only, never a rewrite. `git push` refuses a non-fast-forward update by
  #      default; this job therefore adds no force flag of any kind, and the file must contain none
  #      (asserted by release-master-advance-needs-check's sibling grep, AC1). If master was ever
  #      committed to directly, this job goes RED — which is the intended outcome (§3.1).
  #   3. `needs:` must cover EVERY other job in this file. That one is the only new fragility this
  #      job introduces, and it is precisely the failure mode §6.1 exists to prevent: add a 7th job
  #      to this workflow and forget to list it here, and master advances on a half-green release.
  #      ⛔ Human enumeration drifts, so it is NOT left to review — it is asserted mechanically by
  #      `plugin/scripts/release-master-advance-needs-check.ts`, landed in the SAME batch as this
  #      job (§6.1: "与 A 同批落地，不得延后"). That checker is the reason this list is safe to
  #      read as "the full set" rather than "the set someone remembered".
  #
  # The environment is the tag's own tree (ref: the dispatch input), NOT the dispatching ref: a
  # workflow_dispatch run executes the release.yml carried by the named ref. ⇒ This job only takes
  # effect for a tag cut AFTER this block reached develop; a re-run of an older tag cannot advance
  # master, because that tag's tree does not contain this job at all.
  #
  # First fast-forward is deliberately deferred: it happens automatically the first time every job
  # below succeeds (§1 ⑤ 问 4 — waiting for a fully green release rather than ff-ing onto the red
  # v0.6.3). Until then master standing still is the rule's correct output, not a defect.
  advance-master:
    needs: [release, sea-release, sea-verify-node-free, sea-verify-node-free-cross-platform,
            dist-verify-node-floor, delivery-manifest-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the push below moves master across this tag's whole history, and a
          # shallow clone cannot reason about (or serve) the fast-forward. The dispatching job that
          # cut the tag used the same depth for the same reason.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Fast-forward master to this release's tag
        env:
          TAG: ${{ inputs.tag }}
        # Pushing <tag>:master updates refs/heads/master to the tag's commit. `git push` rejects a
        # non-fast-forward update on its own, so invariant 2 needs no extra code — and adding a
        # force flag would silently destroy it, which is why none appears anywhere in this file.
        run: |
          set -euo pipefail
          echo "advance-master: fast-forwarding refs/heads/master to ${TAG}"
          git log -1 --format='%H %cI %s' "${TAG}"
          git push origin "${TAG}:master"
          echo "advance-master: origin/master now at $(git rev-parse "${TAG}^{commit}")"
