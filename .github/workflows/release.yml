name: Release

# Manually triggered against an EXISTING version tag (v*).
#
# ── WHAT THIS WORKFLOW IS, AFTER THE 2026-09-16 RULING ────────────────────────────────────────────
# Human ruling 2026-09-16, verbatim: 「取消 sea 和 npm release。这些是我们最近没有精力去保障的。」
# and, on what `advance-master` should gate on instead: 「按照 claude code plugin 发布和安装。
# CI 应当按此设计。」 (recorded in orchestration/SPEC-release-and-hotfix-branching-2026-09-15.md §11).
#
# So this file no longer builds or publishes npm-pack tarballs or Node-SEA executables. The channel
# whose health gates `master` is the Claude Code PLUGIN channel, and the gate is a real install of
# THIS TAG's plugin build — not a build-success reading.
#
# The five jobs that used to carry the artifacts (`release`, `sea-release`,
# `sea-verify-node-free`, `sea-verify-node-free-cross-platform`, `dist-verify-node-floor`) and the
# `--ci` asset cross-check (`delivery-manifest-verify`) are GONE, together with the workflow-level
# `SEA_NODE_VERSION` env those jobs were the only consumers of. The npm/SEA artifact line was the
# only reason any of them existed; leaving one behind would have been a job that verifies something
# the project no longer ships.
#
# ⚠️ `ci.yml` carries a job with the SAME NAME as the deleted `dist-verify-node-floor`. That one is
# a different job, in a different workflow, building its own artifact — it is NOT in this file's
# scope and is deliberately untouched.
#
# ── BUT THE GITHUB RELEASE **OBJECT** IS NOT AN ARTIFACT DELIVERY ─────────────────────────────────
# The ruling cancelled the artifact CHANNELS (npm tarballs, Node-SEA executables). It did not — and
# could not have meant to — cancel the published release itself. The deleted `release` job carried
# TWO responsibilities: ① build the npm/SEA artifacts, and ② attach them to a GitHub Release via
# `softprops/action-gh-release`. Only ① was ruled out; ② is the marking action that makes a release
# USER-PERCEIVABLE at all, and it went with the job by accident. Measured consequence (2026-09-16,
# a real v0.8.0 cut): the run went green, `advance-master` really fast-forwarded `master`, and
# `https://github.com/yaleh/quay/releases` still showed v0.7.1 as Latest — `gh release view v0.8.0`
# returned "release not found". That is the same 版本号说谎 class this SPEC exists to end, only
# relocated: the release genuinely happened and the user-visible channel cannot tell.
# So `create-github-release` below re-adds ② ALONE: a marking GitHub Release with generated notes and
# NO asset uploads — the channel the human ruling kept (`按照 claude code plugin 发布和安装`) is
# already verified by `verify-plugin-channel`, and nothing in this file ships a binary.
# (tasks/gap-release-yml-missing-github-release-object, GOAL-020 AC-274.)
#
# gap-github-actions-no-implicit-triggers (2026-09-14, human ruling): this workflow is
# `workflow_dispatch` ONLY. A tag push is not an implicit "please release" request — a plain
# `git push --tags` must never have a GitHub-writing side effect on its own. `github.ref_name`
# (only meaningful for a ref-triggered run) is replaced throughout this file by the `tag` input.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. v0.7.1) — must already exist"
        required: true
        type: string

jobs:
  # ── verify-plugin-channel ─────────────────────────────────────────────────────────────────────
  # The gate on `master` (replaces the six artifact jobs as `advance-master`'s dependency).
  #
  # WHY A REAL INSTALL AND NOT A BUILD READING: `master` is defined as "the tag of the most recent
  # FULLY GREEN release run" (SPEC §6), so the only thing that makes that definition true is a
  # check that fails when the delivered channel is broken. A build-success reading cannot: the
  # npm .tgz and the SEA archives both built successfully for releases that no consumer could
  # actually use, and nothing in this repo turned red (SPEC §2.2 后果 3). This job therefore
  # exercises the deliverable end to end, exactly as the 2026-09-16 manual verification did on a
  # fresh machine: install it through the marketplace, initialize a project from the installed
  # copy, bring up the drivers, and answer HTTP.
  #
  # TAG-PINNING (why the plugin is BUILT here rather than fetched from `dist-plugin`): the
  # `dist-plugin` orphan branch is a ROLLING channel — it is republished from whatever ref was
  # named the last time someone dispatched publish-plugin-dist.yml, and its own declared version
  # need not be the tag under release. Installing it here would gate `master` on an artifact that
  # is not the tag: master would advance to vX.Y.Z after a green run that never touched vX.Y.Z.
  # So the plugin subtree is built FROM THE DISPATCHED TAG's tree, through the SAME single
  # mechanism `publish-dist-branch.yml` uses (`plugin/scripts/publish-dist-branch.sh`, no `--push`)
  # — so this job adds no second build implementation (the property GOAL-019 AC-275 pins for the
  # sibling channel), and nothing is published from here. The built tree is extracted from the
  # orphan commit with `git archive` (the artifact, never a `cp` of the working tree), matching
  # test/cold-start-e2e.sh --from-build.
  #
  # ⛔ NOT "naturally isolated" — this job runs on a SELF-HOSTED runner (see `runs-on` below), whose
  # `~/.claude` PERSISTS across runs and already carries a `quay` marketplace declaration. The
  # GitHub-hosted premise ("the runner starts empty") was true when this comment was written and
  # stopped being true at AC-319; leaving it is what made the project-scope arm below check the
  # wrong artifact (tasks/gap-release-yml-project-scope-install-not-home-isolated, v0.19.0). Every
  # scope arm therefore builds its OWN scratch `HOME`, and a defect here is not a stale comment but
  # a gate that silently judges a differently-sourced install.
  verify-plugin-channel:
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319): the metered
    # ubuntu-latest gate refused to START this job on 2026-09-24, which is why the v0.12.0 release
    # run was not executable. node/npm/npx below come from the actions/setup-node step (tokyo-alpha's
    # image node is v10 with no npm, so nothing here may rely on the image).
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # fetch-depth: 0 — the build below creates an orphan branch + a throwaway worktree off
          # HEAD, and reads the tag's whole tree. A shallow clone cannot serve that.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The plugin build (esbuild) needs the workspace's dependencies, exactly as
      # publish-plugin-dist.yml's own job does before it calls the same script.
      - name: Install dependencies
        run: npm install

      - name: Build the plugin subtree from this tag (canonical path, no push)
        run: bash plugin/scripts/publish-dist-branch.sh --branch plugin-channel-verify

      - name: Extract the built plugin from the orphan commit
        # `git archive` of the orphan commit, NOT a copy of the working tree: the built tree is what
        # a consumer receives (dist/*.js bundles, raw .ts stripped, closure-verified) — a `cp` of
        # `plugin/` would carry raw .ts that the plugin cache cannot resolve (no node_modules).
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/plugin-channel-src"
          git archive plugin-channel-verify | tar -x -C "${RUNNER_TEMP}/plugin-channel-src"
          test -f "${RUNNER_TEMP}/plugin-channel-src/.claude-plugin/marketplace.json"
          test -f "${RUNNER_TEMP}/plugin-channel-src/bin/quay"
          test -f "${RUNNER_TEMP}/plugin-channel-src/vendor/quay/dist/quay.js"

      - name: Install the Claude Code CLI (the plugin channel's own installer)
        run: npm install -g @anthropic-ai/claude-code

      - name: Register the built plugin as a marketplace and install it into a scratch project
        # A SCRATCH project, not this repository: installing quay into the very tree that is being
        # released would make the gate depend on the repo's own plugin state (and on the repo's own
        # .claude/settings.json), i.e. self-installation. The scratch dir is empty and permanent
        # only for this run.
        #
        # ⛔ AND A SCRATCH `HOME`. THIS IS NOT HYGIENE, IT IS CORRECTNESS
        # (tasks/gap-release-yml-project-scope-install-not-home-isolated, found by the v0.19.0
        # release). A marketplace name is ONE machine-wide slot, and the self-hosted runner image
        # bakes `~/.claude/settings.json` with a `quay` marketplace already declared (the published
        # GitHub channel). `claude plugin marketplace add <local dir>` does NOT override an existing
        # declaration: it answers `Marketplace 'quay' already on disk — declared in user settings`,
        # and `claude plugin install quay@quay` then installs the PUBLISHED artifact — so the
        # assertions below judge something other than the tree this run built. This is the PROJECT
        # scope arm; the user-scope arm below already had its own HOME, and ci.yml's channel job
        # carries the same fix (`ci.yml` "Register the built plugin …"). Both arms must be isolated,
        # or the scope that is not is the one that silently checks the wrong artifact.
        env:
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          mkdir -p "$HOME"
          rm -rf "$SCRATCH"
          mkdir -p "$SCRATCH"
          cd "$SCRATCH"
          claude plugin marketplace add "${RUNNER_TEMP}/plugin-channel-src"
          claude plugin install quay@quay --scope project -y
          echo "--- installed plugin record ---"
          claude plugin list || true

      - name: Resolve the installed plugin cache directory
        id: installed
        # The install above lands the plugin in Claude Code's cache; every later step runs the
        # INSTALLED copy (the CLI entry + its bundle, from the cache), not the build directory — the
        # same path the 2026-09-16 manual verification used. Fail closed if no cache entry carries
        # the CLI entry point: "could not resolve" must not read as "nothing to check".
        # ⛔ Same isolated HOME as the install step: the cache this reads must be the one that
        # install wrote (tasks/gap-release-yml-project-scope-install-not-home-isolated).
        env:
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          CACHE_ROOT="${HOME}/.claude/plugins/cache/quay/quay"
          test -d "$CACHE_ROOT" || { echo "ERROR: no plugin cache at ${CACHE_ROOT} — the install did not materialise." >&2; exit 1; }
          INSTALLED=""
          for d in "$CACHE_ROOT"/*/; do
            [ -f "${d}bin/quay" ] || continue
            INSTALLED="${d%/}"
          done
          test -n "$INSTALLED" || { echo "ERROR: no cache entry under ${CACHE_ROOT} carries bin/quay." >&2; ls -la "$CACHE_ROOT" >&2 || true; exit 1; }
          echo "installed plugin: $INSTALLED"
          echo "version: $(node -p "require('${INSTALLED}/.claude-plugin/plugin.json').version" 2>/dev/null || echo unknown)"
          echo "dir=${INSTALLED}" >> "$GITHUB_OUTPUT"

      - name: init the scratch project from the installed plugin
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
          # The SAME isolated HOME as the install: the plugin cache, the install record and
          # everything `quay init` resolves must be one graph
          # (tasks/gap-release-yml-project-scope-install-not-home-isolated).
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          test -d "$SCRATCH/.git" || git -C "$SCRATCH" init -q
          CLAUDE_PLUGIN_ROOT="$INSTALLED" "$INSTALLED/bin/quay" init \
            --root "$SCRATCH" \
            --project scratch-project \
            --repo-root "$SCRATCH" \
            --test-command 'node --test' \
            --tmux-session 'scratch-project-0:0.0' \
            --plugin-root "$INSTALLED"
          test -f "$SCRATCH/.quay/config.yml"

      - name: Start the promotion + worker drivers and assert both are alive
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
          # Same isolated HOME (tasks/gap-release-yml-project-scope-install-not-home-isolated): the
          # drivers resolve their plugin/config state from it, so a shared HOME would run them
          # against a different graph than the one installed and initialised above.
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          QUAY_BIN="${INSTALLED}/bin/quay"
          for kind in promotion worker; do
            ( cd "$SCRATCH" && "$QUAY_BIN" driver start --kind "$kind" --root "$SCRATCH" )
          done
          # `--json` is the driver kernel's own structured status face (never a screen scrape):
          # `alive` is 1 only when the supervisor is up AND the round carrier is being written.
          fail=0
          for kind in promotion worker; do
            status="$( cd "$SCRATCH" && "$QUAY_BIN" driver status --kind "$kind" --root "$SCRATCH" --json )"
            echo "driver ${kind}: ${status}"
            alive="$(printf '%s' "$status" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).alive))}catch{process.stdout.write("unreadable")}})')"
            if [ "$alive" != "1" ]; then
              echo "ERROR: driver kind '${kind}' is not alive (alive=${alive})." >&2
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Run quay's unified server in the scratch project and probe it
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
          # Same isolated HOME (tasks/gap-release-yml-project-scope-install-not-home-isolated).
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          QUAY_BIN="${INSTALLED}/bin/quay"
          PORT=$(( 20000 + RANDOM % 20000 ))
          echo "$PORT" > "${RUNNER_TEMP}/serve-port"
          # `quay server start` (⛔ NOT a raw `serve … &`): it spawns the host through the SAME
          # systemd-scope envelope `/quay:drivers` uses, so the host lives in its own
          # `quay-serve-*.scope`, writes `.quay/serve.log`, and survives its caller's session scope
          # dying — the mechanism gap-serve-host-spawned-in-caller-session-cgroup-dies-when-cloudcli-
          # restarts fixed. A raw `serve &` inherits the runner shell's cgroup, so the assertion step
          # below would fail for a reason that is the gate's own doing. `--only web,control` both
          # faces, so `quay server status` reads `running` (a web-only host is `degraded`).
          ( cd "$SCRATCH" && "$QUAY_BIN" server start --only web,control --host 127.0.0.1 --port "$PORT" --root "$SCRATCH" )
          # ANY HTTP response proves the process is up — the status code is not the claim being
          # made. quay's cold start blocks its event loop for ~10s (measured; see the
          # quay-serve-cold-start-blocks-event-loop note), so "no answer yet" is not "failed" and
          # the probe retries for a generous window instead of sampling once.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:${PORT}/" || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "serve answered HTTP ${code} after ${i}s on port ${PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: the quay server did not answer any HTTP response on 127.0.0.1:${PORT} within 60s." >&2
          echo "--- serve log ---" >&2
          cat "$SCRATCH/.quay/serve.log" >&2 || true
          exit 1

      # ── The CHANNEL assertions (tasks/gap-release-gate-verify-plugin-channel-misses-config-
      # validate-version-pointer-scope-and-upgrade-assertions) ─────────────────────────────────────
      # The steps above prove the artifact INSTALLS and RUNS; these prove it is CORRECT — that the
      # config /quay:init wrote validates (CLI + MCP), the version carriers agree and carry no -dev,
      # the project pointer/config are not frozen to a cache version, the driver/server version
      # readings exist, and the serve host runs in its own scope. ONE implementation, called from
      # here AND from the local pre-release drill (README "发布前本地演练"). ⛔ The assertion logic
      # is NOT inlined in this YAML: an inline `run:` block can only run in CI, cannot be replayed
      # before a dispatch, and would have to be written twice across `--scope` values.
      #
      # ⛔ Run the checker from THIS SOURCE CHECKOUT, not from `$INSTALLED`: the published artifact
      # strips raw plugin `.ts` (publish-dist-branch.sh deletes every plugin `.ts`), so the checker
      # exists there only as a dist bundle. It is a gate, not a deliverable.
      # ⛔ That is also what makes the `shipped-set-clean` assertion possible: it reads the rule set
      # (plugin/shipped-set-rules.txt) and the ratchet baseline (plugin/shipped-set-baseline.json)
      # from THIS checkout and walks `--installed` against them — the artifact deliberately carries
      # neither file. The assertion is one of the two halves of
      # tasks/gap-shipped-plugin-tree-excludes-dev-only-content-and-has-a-shrink-only-size-ratchet:
      # the assembly step (publish-dist-branch.sh, run by the step above) applies the SAME rule set as
      # rsync --exclude args, so "what is excluded" and "what is asserted" cannot drift.
      #
      # ── RELATIONSHIP TO ci.yml's PERIODIC `verify-plugin-channel-assertions` JOB ─────────────────
      # KEEP BOTH; they are NOT duplicates — the dedup decision is recorded on
      # tasks/gap-release-channel-assertions-periodic-ci-and-controls and judged mechanically by the
      # `release-channel-gate-wiring` job in ci.yml. The two steps below are the RELEASE BLOCKER:
      # they run on the run that would otherwise publish, and they are the ONLY place the **user
      # scope** install shape is asserted. ci.yml's job is the PRE-RELEASE / nightly exercise of the
      # same checker (project scope only, against the newest release tag) so that the checker's first
      # live execution is no longer a real release. Deleting these steps would delete the user-scope
      # arm and would let a broken artifact ship between two nightly ticks.
      - name: Verify the channel — project-scope assertions
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
          # The SAME isolated HOME the install/init/drivers used
          # (tasks/gap-release-yml-project-scope-install-not-home-isolated).
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
          # `scope-install-shape` reads `<homeDir>/.claude/plugins/installed_plugins.json`; the
          # checker takes it from QUAY_VERIFY_HOME when set, pinning the record read to the SAME
          # isolated HOME the install wrote to instead of relying on HOME inheritance.
          QUAY_VERIFY_HOME: ${{ runner.temp }}/scratch-home
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          # `--built` turns on the FIRST assertion, `install-not-the-built-artifact`: it compares the
          # installed plugin.json version against the tree THIS run built and, on mismatch, FAILs
          # with its OWN reason (naming the registered marketplace) instead of letting
          # `version-consistency` misattribute the cause to the build
          # (tasks/gap-release-yml-project-scope-install-not-home-isolated).
          node --experimental-strip-types plugin/scripts/verify-plugin-channel-assertions.ts \
            --installed "$INSTALLED" --project "$SCRATCH" --scope project \
            --built "${RUNNER_TEMP}/plugin-channel-src"

      # ── user-scope install + the same assertion set (verified locally, 2026-10-06, with exactly
      # these commands under an isolated HOME — see the task's completion record). WHY A FRESH HOME:
      # a user-scope install is machine-global (`~/.claude/plugins/installed_plugins.json`), and a
      # self-hosted runner persists it across runs — a fresh HOME is what keeps this job's
      # "naturally isolated" premise true. `QUAY_VERIFY_HOME` points the checker's install-record
      # lookup at that HOME (the CLI subprocesses resolve their own config from it too, because the
      # step exports HOME). ⛔ The user project is a SECOND scratch project: its `.quay/plugin` must
      # point at the USER-scope cache dir, which is a different directory than the project-scope one.
      - name: Verify the channel — user-scope install + assertions
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
        run: |
          set -euo pipefail
          USER_HOME="${RUNNER_TEMP}/user-scope-home"
          USER_SCRATCH="${RUNNER_TEMP}/scratch-project-user"
          rm -rf "$USER_HOME" "$USER_SCRATCH"
          mkdir -p "$USER_HOME" "$USER_SCRATCH"
          export HOME="$USER_HOME" CLAUDE_CONFIG_DIR="$USER_HOME/.claude"
          ( cd "$USER_SCRATCH" && git init -q )
          claude plugin marketplace add "${RUNNER_TEMP}/plugin-channel-src"
          ( cd "$USER_SCRATCH" && claude plugin install quay@quay --scope user -y )
          USER_INSTALLED="$(node -e 'const o=require(process.env.HOME+"/.claude/plugins/installed_plugins.json");const e=(o.plugins["quay@quay"]||[]).find(x=>x.scope==="user");if(!e){console.error("no user-scope install record");process.exit(1)}process.stdout.write(e.installPath)')"
          echo "$USER_INSTALLED" > "${RUNNER_TEMP}/user-installed"
          test -f "$USER_INSTALLED/bin/quay"
          CLAUDE_PLUGIN_ROOT="$USER_INSTALLED" "$USER_INSTALLED/bin/quay" init \
            --root "$USER_SCRATCH" --project scratch-user --repo-root "$USER_SCRATCH" \
            --test-command 'node --test' --plugin-root "$USER_INSTALLED"
          for kind in promotion worker; do
            ( cd "$USER_SCRATCH" && "$USER_INSTALLED/bin/quay" driver start --kind "$kind" --root "$USER_SCRATCH" ) || true
          done
          ( cd "$USER_SCRATCH" && "$USER_INSTALLED/bin/quay" server start --only web,control --host 127.0.0.1 --port 0 --root "$USER_SCRATCH" )
          node --experimental-strip-types plugin/scripts/verify-plugin-channel-assertions.ts \
            --installed "$USER_INSTALLED" --project "$USER_SCRATCH" --scope user

      - name: Stop the drivers and the server
        if: always()
        # The runner is destroyed after the run, so this is cleanliness rather than correctness —
        # but a leftover driver on a re-used runner would make the NEXT run's `alive=1` assertion
        # pass for the wrong reason.
        env:
          INSTALLED: ${{ steps.installed.outputs.dir }}
          # Same isolated HOME as the start (tasks/gap-release-yml-project-scope-install-not-home-
          # isolated): stop must reach the SAME driver/server state the start created.
          HOME: ${{ runner.temp }}/scratch-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/scratch-home/.claude
        run: |
          set -euo pipefail
          SCRATCH="${RUNNER_TEMP}/scratch-project"
          if [ -n "${INSTALLED:-}" ] && [ -x "${INSTALLED}/bin/quay" ]; then
            ( cd "$SCRATCH" && "${INSTALLED}/bin/quay" server stop --only web,control --root "$SCRATCH" ) || true
            for kind in promotion worker; do
              ( cd "$SCRATCH" && "${INSTALLED}/bin/quay" driver stop --kind "$kind" --root "$SCRATCH" ) || true
            done
          fi
          USER_SCRATCH="${RUNNER_TEMP}/scratch-project-user"
          if [ -s "${RUNNER_TEMP}/user-installed" ]; then
            USER_INSTALLED="$(cat "${RUNNER_TEMP}/user-installed")"
            if [ -x "$USER_INSTALLED/bin/quay" ]; then
              ( cd "$USER_SCRATCH" && "$USER_INSTALLED/bin/quay" server stop --only web,control --root "$USER_SCRATCH" ) || true
              for kind in promotion worker; do
                ( cd "$USER_SCRATCH" && "$USER_INSTALLED/bin/quay" driver stop --kind "$kind" --root "$USER_SCRATCH" ) || true
              done
            fi
          fi
          exit 0

  # ── create-github-release (tasks/gap-release-yml-missing-github-release-object) ────────────────
  # Restores the MARKING half of what the deleted `release` job did (see the header note): a GitHub
  # Release object for `inputs.tag` with generated notes and NO asset uploads — this file ships no
  # binaries any more, and the channel the human ruling kept (the Claude Code plugin) is what
  # `verify-plugin-channel` proves works.
  #
  # WHY A SEPARATE JOB RATHER THAN A LAST STEP INSIDE `verify-plugin-channel` (the Plan left this to
  # the implementer, so the reasons are written down):
  #   1. LEAST PRIVILEGE. Creating a Release needs `contents: write`. `verify-plugin-channel`
  #      declares `contents: read` and is the job that runs `npm install` and `npm install -g`s a
  #      third-party CLI — the run's least trusted steps. Widening ITS token so that one late step
  #      can write would hand write scope to everything before it.
  #   2. A READABLE GATE. Each name in `advance-master.needs` is an independently-failable claim.
  #      Folding the write into the verify job would merge "the channel is broken" and "no release
  #      object could be created" into one red reading on a job whose name asserts only the former.
  #   The price of that choice is the one thing §6.1 invariant 3 charges for: a new job MUST be named
  #   in `advance-master.needs`, or master advances on a release nobody can see. That is not left to
  #   review — `plugin/scripts/release-master-advance-needs-check.ts` derives the expected set from
  #   this file's own job keys, and its mutation case phase E drives a verbatim copy of this file.
  #
  # ORDERING: `needs: [verify-plugin-channel]` places the write AFTER the gate, so a release object
  # is never created for a tag whose channel does not install, initialise and serve.
  create-github-release:
    needs: [verify-plugin-channel]
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319). ⛔ NO actions/setup-node
    # step belongs here: this job has NO checkout and invokes NO node/npm/npx — every operation goes
    # through the `gh` REST API, which the runner image already provides.
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release object for this tag (idempotent)
        id: github-release
        # ⛔ THE TAG COMES FROM THE DISPATCH INPUT, never `github.ref_name` — same reason as the rest
        # of this file (gap-github-actions-no-implicit-triggers: `workflow_dispatch` only, so a
        # ref-triggered expression would be meaningless here).
        # ⛔ NO CHECKOUT STEP, deliberately: every operation below goes through the REST API via
        # `gh`, which is why `--repo` is passed explicitly (`gh` cannot infer the repository from a
        # working tree that is not there) — and the job therefore cannot accidentally act on
        # whatever the runner's git state happens to be.
        env:
          # GITHUB_TOKEN with `contents: write` suffices here: unlike `advance-master`'s push, this
          # step writes no .github/workflows file, so it does not need RELEASE_PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${TAG}" || { echo "ERROR: TAG is empty — refusing to guess which release to create." >&2; exit 1; }
          test -n "${REPO}" || { echo "ERROR: REPO is empty." >&2; exit 1; }

          # The ONE reading that counts as "already released": a Release object whose tag is exactly
          # ${TAG}. Exit status alone would not do — `gh release view` also exits non-zero on a
          # transient API/auth error, and treating that as "does not exist" is the wrong direction to
          # guess in. Comparing the READ-BACK VALUE distinguishes "definitely absent" from "could not
          # ask" without ever rendering the latter as the former.
          release_exists() {
            local got=""
            got="$(gh release view "${TAG}" --repo "${REPO}" --json tagName --jq '.tagName' 2>/dev/null)" || true
            [ "${got}" = "${TAG}" ]
          }

          # ── IDEMPOTENCY (a hard constraint, not a nicety) ──────────────────────────────────────
          # A tag may legitimately be dispatched twice (a re-run after a network failure, a retry of
          # a partially-green run). `gh release create` has NO upsert flag — `gh release create
          # --help` (v2.97.0) offers --draft/--prerelease/--latest/--verify-tag and nothing that
          # means "already exists ⇒ skip/update" — and it FAILS on a tag that already has a release.
          # So the guard is explicit, and its outcome is always READ BACK rather than inferred from
          # an error string.
          if release_exists; then
            echo "GitHub Release ${TAG} already exists on ${REPO} — nothing to create (idempotent re-dispatch)."
            exit 0
          fi

          # `--verify-tag` IS LOAD-BEARING, not decoration: without it, if the tag does not exist on
          # the remote, `gh release create` CREATES one from the default branch's current state
          # (`gh release create --help`, v2.97.0: "If a matching git tag does not yet exist, one will
          # automatically get created from the latest state of the default branch") — i.e. it would
          # fabricate a version tag pointing at master, which is precisely the "the version number
          # lies" failure class this whole SPEC exists to end. `--verify-tag` aborts instead.
          # `--generate-notes` gives the Release a real changelog, which is what makes the page worth
          # looking at; it needs no artifacts, so it adds no dependency on the retired channel.
          set +e
          create_out="$(gh release create "${TAG}" \
            --repo "${REPO}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes 2>&1)"
          create_rc=$?
          set -e

          if [ "${create_rc}" -eq 0 ]; then
            echo "Created GitHub Release ${TAG} on ${REPO}."
            printf '%s\n' "${create_out}"
            exit 0
          fi

          echo "gh release create exited ${create_rc}:" >&2
          printf '%s\n' "${create_out}" >&2

          # EXACTLY ONE failure cause is tolerated — the object already exists (a concurrent or
          # earlier run created it between the check above and here) — and it is tolerated ONLY
          # after reading that back from the API. ⛔ NOT a blanket `|| true`: a create that failed
          # for any other reason, with no release present, must stay RED. Rendering "could not
          # create" as "nothing to do" is the 硬规则 3b shape (a failure that reads as success).
          if release_exists; then
            echo "…however a GitHub Release for ${TAG} DOES exist (read back from the API): treating the create failure as an idempotent no-op."
            exit 0
          fi
          echo "ERROR: no GitHub Release exists for ${TAG} on ${REPO}, and it could not be created." >&2
          exit 1

  # ── advance-master (orchestration/SPEC-release-and-hotfix-branching-2026-09-15.md §6.1) ────────
  # master is redefined as "the tag of the most recent FULLY GREEN release run" and is advanced by
  # exactly this one event — never by a direct commit. This job is that event. It exists because
  # before it, nothing in this repo moved master at all: measured 2026-09-15, master was frozen at
  # 9316b797d (2026-08-03) while develop ran ~19.6k commits ahead, and no workflow, script or task
  # contained the name `advance-master` — the mechanism the human ruling named (§1 ⑤ 问 3, option A)
  # had zero implementation.
  #
  # THREE INVARIANTS (§6.1), each carried by a MECHANISM rather than by review:
  #   1. any dependency not fully successful ⇒ master does not move. That is GitHub Actions' own
  #      `needs:` semantics (a job whose dependency did not succeed is SKIPPED), so fail-closed is
  #      the default here, not code that could be forgotten.
  #   2. fast-forward only, never a rewrite. `git push` refuses a non-fast-forward update by
  #      default; this job therefore adds no force flag of any kind, and the file must contain none
  #      (asserted by release-master-advance-needs-check's sibling grep, AC1). If master was ever
  #      committed to directly, this job goes RED — which is the intended outcome (§3.1).
  #   3. `needs:` must cover EVERY other job in this file. That one is the only new fragility this
  #      job introduces, and it is precisely the failure mode §6.1 exists to prevent: add a job to
  #      this workflow and forget to list it here, and master advances on a half-green release.
  #      ⛔ Human enumeration drifts, so it is NOT left to review — it is asserted mechanically by
  #      `plugin/scripts/release-master-advance-needs-check.ts`. That checker derives the expected
  #      set from THIS FILE's own job keys on every run (nothing hardcoded), so removing the six
  #      artifact jobs above and adding `verify-plugin-channel` needed no edit to it — only a
  #      re-run, which is what proves it is derived rather than a copy.
  #
  # The environment is the tag's own tree (ref: the dispatch input), NOT the dispatching ref: a
  # workflow_dispatch run executes the release.yml carried by the named ref. ⇒ This job only takes
  # effect for a tag cut AFTER this block reached develop; a re-run of an older tag cannot advance
  # master, because that tag's tree does not contain this job at all.
  #
  # First fast-forward is deliberately deferred: it happens automatically the first time every job
  # below succeeds (§1 ⑤ 问 4 — waiting for a fully green release rather than ff-ing onto a red
  # one). Until then master standing still is the rule's correct output, not a defect.
  advance-master:
    # `create-github-release` is listed because invariant 3 is about EVERY other job: master is
    # "the tag of the most recent FULLY GREEN release run", and a run whose release object was never
    # created is not a release anyone can see (see the header note). Omitting it would let master
    # advance onto a release that exists only in `.quay/ci-runs.jsonl`.
    needs: [verify-plugin-channel, create-github-release]
    # self-hosted (gap-metered-hosted-runner-jobs-to-self-hosted, AC-319). ⛔ NO actions/setup-node
    # step belongs here: this job is a git checkout + `git push` — it invokes NO node/npm/npx.
    runs-on: [self-hosted, tokyo-alpha]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — the push below moves master across this tag's whole history, and a
          # shallow clone cannot reason about (or serve) the fast-forward. The dispatching job that
          # cut the tag used the same depth for the same reason.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          # github-token-cannot-push-workflow-file-changes (2026-09-15, measured): the default
          # GITHUB_TOKEN is a GitHub App installation token and `workflows` is NOT a grantable
          # `permissions:` key, so a push that updates .github/workflows/* is unconditionally
          # rejected ("refusing to allow a GitHub App to create or update workflow ... without
          # `workflows` permission") regardless of what this job's own `permissions:` block says.
          # RELEASE_PAT is a PAT with `workflow` scope (repo secret) — the only credential class
          # that can push a workflow-file-touching commit. `contents: write` above stays as the
          # least-privilege declaration for the job's OWN GITHUB_TOKEN (unused for the push now,
          # kept so a future step that doesn't touch workflow files still has it).
          token: ${{ secrets.RELEASE_PAT }}
      - name: Fast-forward master to this release's tag
        env:
          TAG: ${{ inputs.tag }}
        # ⛔ PUSH THE PEELED COMMIT, NOT THE TAG NAME. `git push origin <annotated-tag>:master` is
        # REJECTED by the receiving repo — measured 2026-09-15 in a scratch remote pair:
        #   remote: error: cannot update ref 'refs/heads/master': trying to write non-commit object
        #   <tag-object-sha> to branch 'refs/heads/master' -> [remote rejected] (failed to update ref)
        # An annotated tag is a tag OBJECT and refs/heads/* must point at a COMMIT, so the refspec
        # source has to be peeled first. Every version tag in this repo is annotated
        # (`git cat-file -t v0.7.0` -> `tag`), so the unpeeled form would have failed on every real
        # release — and nothing local could have caught it: the syntax is valid, the history is
        # present, and only the remote's own ref-update rule refuses the write.
        # `git push` still rejects a non-fast-forward update on its own, so invariant 2 needs no
        # extra code here — and adding a force flag would silently destroy it, which is why no force
        # flag appears anywhere in this file. (Both directions were checked: the unpeeled refspec
        # fails, the peeled one fast-forwards.)
        run: |
          set -euo pipefail
          echo "advance-master: fast-forwarding refs/heads/master to ${TAG}"
          git log -1 --format='%H %cI %s' "${TAG}"
          # Peel the annotated tag to its commit. This is the same expression the closing echo used
          # below — the push refspec was the one place it was missing.
          TARGET="$(git rev-parse "${TAG}^{commit}")"
          git push origin "${TARGET}:master"
          echo "advance-master: origin/master now at ${TARGET}"
