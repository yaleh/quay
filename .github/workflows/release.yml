name: Release

# QX-033 (experiment 4, iteration 9): closes CB-008 (no packaging/distribution).
# Triggers on version tags (v*). Builds a distributable npm pack artifact and
# publishes it to the GitHub Release created by the tag push.
#
# Approach: npm pack (Option B) — produces quay-<version>.tgz installable via
# `npm install -g quay-<version>.tgz`. No build toolchain required beyond Node.js.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # M120 (DIR-060): the "Run tests" step below spawns the `.ts` CLI bins
          # as subprocesses, which only Node >=23 runs natively — bumped 20 -> 24.
          # RUNNER version only; `engines` stays >=20.0.0. The distributed
          # tarball's actual Node-20 floor is proven by dist-verify-node-floor.
          # (sea-release stays on '20' — its own separate build path.)
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        # QX-056 (experiment 4, iteration 15): DIR-004 publish.
        # GH_TOKEN required: packages/quay/test/cli.test.mjs includes integration
        # tests that spawn `quay --provider github` making live GitHub API calls
        # against yaleh/quay. Without GH_TOKEN the gh CLI subprocess returns 403.
        # github.token has read access to this repo's issues by default.
        # quay-github package tests are excluded (they require broader org perms).
        #
        # M120 (DIR-060) follow-up fix: this bare glob also silently pulled in
        # test/serve-github.test.mjs and test/provider-abi-conformance.test.mjs,
        # 2 suites CLAUDE.md documents as requiring exclusion for a clean run
        # (they hit LIVE GitHub and FAIL/hang when github.token lacks write
        # perms or repo state drifts). This was previously masked: the OLD
        # Node-20 `.ts`-extension crash always aborted this step before
        # reaching these files. Fixing the Node-floor regression exposed this
        # separate, pre-existing gap — a real v0.3.6 release run hit exactly
        # this (provider-abi-conformance crashed on a 403, then the job hung
        # past the 10-minute timeout). Apply the same exclusion CLAUDE.md's
        # own local-run instructions already document.
        #
        # A real v0.3.7 release run then found a THIRD file needing the same
        # treatment: cli-edit-parity-conformance.test.mjs has its own live
        # "GitHub leg" doing MUTATING writes (title/labels/parent edits to
        # real yaleh/quay issues gh-11/gh-3), which needs broader org perms
        # than the default read-only github.token — not previously
        # documented in CLAUDE.md.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --test $(ls packages/quay/test/*.mjs | grep -vE 'serve-github|provider-abi-conformance|cli-edit-parity-conformance') packages/quay-native/test/*.test.mjs

      - name: Build release artifact (npm pack)
        id: pack
        run: |
          bash packages/quay/scripts/package.sh
          # npm pack produces quay-<version>.tgz where version has no 'v' prefix
          # (git tags use v0.1.0 but package.json version is 0.1.0 — the 'v' must be stripped)
          ARTIFACT=$(ls -1t packages/quay/quay-*.tgz 2>/dev/null | head -1)
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "Built: ${ARTIFACT}"

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.artifact }}
          body: |
            ## quay ${{ github.ref_name }}

            Install globally with Node.js >= 20:

            ```sh
            # Download the .tgz from this release page, then:
            npm install -g quay-*.tgz
            quay --help
            quay serve
            ```

            The `.tgz` artifact attached to this release is produced by `npm pack` from `packages/quay/`.
            It includes all runtime dependencies (`@modelcontextprotocol/sdk`, `yaml`) and the CLI entrypoint (built as `dist/quay.js`).
            Note: the artifact filename uses the package version (e.g. `quay-0.1.0.tgz`), not the git tag (e.g. `v0.1.0`).

  # M01-dist (exp5, iteration 0): DIR-004 remaining scope — single-file
  # executables via Node SEA, requiring no separately-installed Node.js
  # runtime on the end user's machine. See packages/quay/scripts/build-sea.sh
  # and packages/quay-native/scripts/build-sea.sh for the build logic and why
  # BOTH packages need their own SEA binary (Core spawns the Provider's
  # mcp_entry as a child process; `quay serve` is not genuinely Node-free
  # unless mcp_entry also points at a SEA binary, not `node ...`).
  sea-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x64
          - os: macos-latest
            asset_suffix: macos-arm64
          - os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build quay (Core) SEA binary
        shell: bash
        run: bash packages/quay/scripts/build-sea.sh

      - name: Build quay-native (Provider) SEA binary
        shell: bash
        run: bash packages/quay-native/scripts/build-sea.sh

      - name: Assemble release bundle (both binaries + packaged .quay/config.yml)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="dist-sea-release"
          rm -rf "${BUNDLE_DIR}"
          mkdir -p "${BUNDLE_DIR}/.quay" "${BUNDLE_DIR}/tasks"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp packages/quay/dist-sea/quay.exe "${BUNDLE_DIR}/quay.exe"
            cp packages/quay-native/dist-sea/quay-native.exe "${BUNDLE_DIR}/quay-native.exe"
            MCP_ENTRY='["./quay-native.exe", "mcp"]'
          else
            cp packages/quay/dist-sea/quay "${BUNDLE_DIR}/quay"
            cp packages/quay-native/dist-sea/quay-native "${BUNDLE_DIR}/quay-native"
            MCP_ENTRY='["./quay-native", "mcp"]'
          fi
          cat > "${BUNDLE_DIR}/.quay/config.yml" <<EOF
          # Packaged config for the SEA/single-file-executable distribution
          # (M01-dist). Both quay and quay-native are compiled Node SEA
          # binaries placed side-by-side in this directory; mcp_entry
          # invokes the sibling binary directly (no node on PATH required).
          providers:
            native:
              enabled: true
              path: "."
              tasks_dir: "./tasks"
              mcp_entry: ${MCP_ENTRY}
              env:
                QUAY_NATIVE_TASKS_DIR: "./tasks"
          EOF

      - name: Archive release bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/quay/package.json').version")"
          ARCHIVE_NAME="quay-sea-${VERSION}-${{ matrix.asset_suffix }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${ARCHIVE_NAME}.zip" ./dist-sea-release/*
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" -C dist-sea-release .
            echo "ARCHIVE_PATH=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload SEA archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          body: |
            ## quay ${{ github.ref_name }} — single-file executables (Node SEA)

            Platform-specific archives (`quay-sea-<version>-<platform>.{tar.gz,zip}`)
            contain two single-file executables (`quay`, `quay-native`) plus a
            packaged `.quay/config.yml` wiring them together — no separately
            installed Node.js runtime required. Extract the archive and run:

            ```sh
            ./quay --help
            ./quay serve
            ```

  # Independent verification job (M01-dist Done-when clause 4, it0
  # domain-misfit audit-channel): downloads the Linux SEA archive this same
  # workflow run just published and runs it in a container image that has
  # never had Node.js installed, proving the executable is genuinely
  # Node-free end-to-end — not just "the build succeeded".
  sea-verify-node-free:
    needs: sea-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: debian:stable-slim
    steps:
      - name: Install runtime deps (libatomic1; explicitly NOT nodejs, NOT gh)
        run: |
          apt-get update -qq
          apt-get install -y -qq libatomic1 curl tar
      - name: Confirm no Node.js is present in this verification shell
        run: |
          if command -v node >/dev/null 2>&1; then
            echo "ERROR: node is present — this job does not prove Node-free operation." >&2
            exit 1
          fi
          echo "Confirmed: no node on PATH."
      - name: Download the SEA archive published by sea-release (this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # M01-dist iteration-1: `gh` (the GitHub CLI) is preinstalled on
          # ubuntu-latest HOST runners but is NOT present in a bare
          # debian:stable-slim `container:` job — a real "command not found"
          # (exit 127) was hit here, not assumed. Use the GitHub REST API
          # directly via curl instead, which only needs curl (already
          # installed above) and keeps this job's dependency footprint
          # minimal (no extra apt repo for `gh`).
          #
          # This repo is PRIVATE (confirmed: `gh api repos/.../ --jq .private`
          # -> true), so a plain GET of the release's `browser_download_url`
          # returns 404 even with a valid bearer token (verified directly,
          # exit 22/HTTP 404) — private-repo release assets require the
          # dedicated assets API endpoint with an octet-stream Accept header,
          # not the public web download URL. Fetch the asset id from the
          # release-by-tag API, then GET
          # /releases/assets/{id} with Accept: application/octet-stream.
          VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          ASSET_NAME="quay-sea-${VERSION}-linux-x64.tar.gz"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ github.ref_name }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          mkdir -p extracted
          tar -xzf "${ASSET_NAME}" -C extracted
      - name: Run quay --help (no Node on PATH)
        run: |
          cd extracted
          chmod +x ./quay ./quay-native
          ./quay --help
      - name: Run quay serve and curl it (no Node on PATH)
        run: |
          cd extracted
          ./quay serve --port 18080 &
          SERVE_PID=$!
          sleep 2
          curl -sf -o /dev/null -w "http_code:%{http_code}\n" http://localhost:18080/
          kill "$SERVE_PID"

  # M122 (exp5-DEFECT-SEA-VERIFY-SINGLE-PLATFORM-ONLY): the macOS/Windows counterpart to
  # sea-verify-node-free above. GitHub Actions `container:` (the Linux job's Node-free technique)
  # only supports Linux runners — macos-latest/windows-latest images ship Node.js preinstalled with
  # no container isolation available. Proves Node-freeness instead by explicitly stripping every
  # PATH directory containing a `node`/`node.exe` binary before running the SEA binary, then
  # confirming `command -v node` genuinely fails under that stripped PATH (same standard of evidence
  # as the Linux job's "no node on PATH" check, achieved by a different mechanism appropriate to
  # runners that can't be containerized).
  sea-verify-node-free-cross-platform:
    needs: sea-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_suffix: macos-arm64
            archive_ext: tar.gz
          - os: windows-latest
            asset_suffix: windows-x64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Download the SEA archive published by sea-release (this run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same private-repo assets-API fetch technique as sea-verify-node-free above (the public
          # browser_download_url 404s on a private repo even with a valid token).
          VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          ASSET_NAME="quay-sea-${VERSION}-${{ matrix.asset_suffix }}.${{ matrix.archive_ext }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ github.ref_name }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
          mkdir -p extracted
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z x "${ASSET_NAME}" -oextracted >/dev/null
          else
            tar -xzf "${ASSET_NAME}" -C extracted
          fi
      - name: Strip Node.js from PATH and confirm it is genuinely gone
        shell: bash
        run: |
          set -euo pipefail
          STRIPPED_PATH="$(printf '%s' "$PATH" | tr ':' '\n' | while IFS= read -r d; do
            if [ -x "$d/node" ] || [ -x "$d/node.exe" ]; then
              continue
            fi
            printf '%s\n' "$d"
          done | paste -sd: -)"
          echo "STRIPPED_PATH=${STRIPPED_PATH}" >> "$GITHUB_ENV"
          if PATH="${STRIPPED_PATH}" command -v node >/dev/null 2>&1; then
            echo "ERROR: node is still present under the stripped PATH — this job does not prove Node-free operation." >&2
            exit 1
          fi
          echo "Confirmed: no node on the stripped PATH."
      - name: Run quay --help (no Node on stripped PATH)
        shell: bash
        run: |
          cd extracted
          chmod +x ./quay ./quay-native 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PATH="${STRIPPED_PATH}" ./quay.exe --help
          else
            PATH="${STRIPPED_PATH}" ./quay --help
          fi
      - name: Run quay serve and curl it (no Node on stripped PATH)
        shell: bash
        run: |
          cd extracted
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            PATH="${STRIPPED_PATH}" ./quay.exe serve --port 18081 &
          else
            PATH="${STRIPPED_PATH}" ./quay serve --port 18081 &
          fi
          SERVE_PID=$!
          sleep 2
          curl -sf -o /dev/null -w "http_code:%{http_code}\n" http://localhost:18081/
          kill "$SERVE_PID"

  # M120 (DIR-060): floor-verification for the npm-pack tarball. Mirrors
  # sea-verify-node-free's asset-fetch shape (download the asset THIS run just
  # published, private-repo assets API), but keeps Node PRESENT and PINNED to
  # the declared floor (Node 20) — the point is proving the distributed `bin`
  # (dist/quay.js) runs on Node 20, the exact regression the real v0.3.5 release
  # hit (native `.ts` needs Node >=23). The hard, runnable guard that would have
  # caught it before a release attempt did.
  dist-verify-node-floor:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm the runner is really on the declared floor (Node 20)
        run: node --version | grep -E '^v20\.'
      - name: Download the npm-pack tarball published by release (this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same private-repo asset-fetch path as sea-verify-node-free: the
          # public browser_download_url 404s on a private repo, so resolve the
          # asset id from the release-by-tag API and GET the assets endpoint
          # with an octet-stream Accept header.
          VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          ASSET_NAME="quay-${VERSION}.tgz"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          ASSET_ID="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" \
            | grep -B2 "\"name\": *\"${ASSET_NAME}\"" \
            | grep '"id":' | head -1 | grep -o '[0-9]\+')"
          if [ -z "${ASSET_ID}" ]; then
            echo "ERROR: could not find asset id for ${ASSET_NAME} in release ${{ github.ref_name }}" >&2
            exit 1
          fi
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "${ASSET_NAME}" "https://api.github.com/repos/${{ github.repository }}/releases/assets/${ASSET_ID}"
      - name: Install the published tarball on Node 20 and run its packaged bin
        run: |
          set -euo pipefail
          VERSION="$(echo "${{ github.ref_name }}" | sed 's/^v//')"
          echo "Installing quay-${VERSION}.tgz on $(node --version)"
          npm install -g "quay-${VERSION}.tgz"
          quay --help
          quay --version
