# .quay/gates.yml — WORKSPACE-OWNED gate data (DIR-035-B / ADR-013 Decision item 2).
#
# The product (packages/quay/src/gate/registry.js) ships the gate ENGINE + two
# generic factories (`makeIt0Gate`, wrapping one fixed script + a task.extra
# args array; `makeAdrGate`, deriving a gate from an ADR's own `enforcement:`
# field) plus its two true built-ins (`dod`, `acceptance`) and the D1
# `doc-<id>` document-contract gates. Everything else — WHICH scripts get a
# named `it0`-style gate, and WHICH ADRs get an auto-wired `adr-<id>` gate —
# is THIS repo's own workspace data, read at gate-run time (mirrors the
# existing `adr-<id>` gate's own "derived from the ADR store's `enforcement:`
# field at gate-run time, not baked into the module" pattern — this file is
# just that same idea applied one level up, to WHICH ids get wired at all).
#
# A fresh non-exp5 workspace with no gates.yml (or an empty one) sees only the
# product's built-in gates (`dod`, `acceptance`) plus its OWN `doc-*` gates it
# defines here — nothing exp5-specific. This repo (exp5's own workspace)
# declares its 5 it0/vmeta/audit/dogfood gates + its 2 wired ADRs + 1 fixed
# delivery-conformance gate below, to preserve the exact pre-DIR-035-B gate
# set/behavior for its own OUTER-LOOP ABSORB usage (plus DIR-035-D's addition).
#
# Schema:
#   it0:   list of { name, script, argsKey } — each becomes a gate named
#          `name`, wrapping `script` (resolved relative to workspaceRoot) via
#          the SAME `makeIt0Gate(scriptPath, argsKey, label)` factory
#          registry.js already ships (task.extra[argsKey] holds the script's
#          positional args, per the factory's own fail-closed convention).
#   adr:   list of ADR ids (e.g. "ADR-001") to auto-wire as `adr-<id>` gates
#          via the existing `makeAdrGate` factory (ADR dir resolved from this
#          workspace's own native-provider QUAY_NATIVE_ADR_DIR, falling back
#          to `<workspaceRoot>/adr`).
#   fixed: list of { name, script } (DIR-035-D) — each becomes a gate named
#          `name`, wrapping a ZERO-ARGUMENT `script` (resolved relative to
#          workspaceRoot) via `makeFixedScriptGate(scriptPath, label)` — the
#          missing zero-arg case in the same factory family as `it0` (which
#          requires >=1 positional arg per invocation).
#   testPass: list of { name, command } (DIR-042-A) — each becomes a gate
#          named `name`, running `command` (an arbitrary shell command, this
#          repo's own choice of test invocation) via `makeTestPassGate`, PASS
#          iff exit 0. Below, this repo dogfoods it for its OWN DoD
#          meta-enforcer's regression suite (single-source: the CHECK LOGIC
#          — "run a command, PASS iff exit 0" — lives once in the product
#          gate, this repo only supplies its own command as data).
#   coverageFloor: list of { name, command, floor, pattern? } — `command`
#          reports a coverage percentage, `floor` is the minimum acceptable
#          value; `pattern` (optional) is a regex overriding the default
#          `NN(.N)%` extraction. See `makeCoverageFloorGate`.
#   redGreen: list of { name, red, green } — `red` must exit non-zero, `green`
#          must exit 0; PASS iff both hold (a real RED->GREEN transition).
#          See `makeRedGreenGate`.

it0:
  - name: impl-row
    script: "./experiments/quay-perpetual-stream/scripts/it0-impl-row-check.sh"
    argsKey: implRowArgs
  - name: line-budget
    script: "./experiments/quay-perpetual-stream/scripts/it0-ceiling-line-budget-check.sh"
    argsKey: lineBudgetArgs
  - name: vmeta-lag
    script: "./experiments/quay-perpetual-stream/scripts/vmeta-lag-check.sh"
    argsKey: vmetaLagArgs
  - name: audit-independence
    script: "./experiments/quay-perpetual-stream/scripts/audit-independence-check.sh"
    argsKey: auditIndependenceArgs
  - name: dogfood-evidence
    script: "./experiments/quay-perpetual-stream/scripts/it0-dogfood-evidence-gate.sh"
    argsKey: dogfoodEvidenceArgs

adr:
  - "ADR-001"
  - "ADR-007"   # dark-axis instrument regression gate (git-lens-selfcheck); wired 2026-07-20

fixed:
  - name: delivery-standalone-smoke
    script: "./packages/quay/test/delivery-standalone-smoke.sh"   # ADR-013 / DIR-035-D, wired 2026-07-20

# DIR-042-A: this repo's own DoD-meta-enforcer regression suite (its own real
# `node --test` invocation), re-expressed as a CONSUMER of the product's
# generic `test-pass` gate factory rather than a second implementation —
# proves single-source dogfooding (ADR-004). PASS iff the suite exits 0
# (all cases pass); command supplied here as pure workspace data.
testPass:
  - name: it0-dod-check-tests
    command: "node --test experiments/quay-perpetual-stream/test/it0-dod-check.test.mjs"
