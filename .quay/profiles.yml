# .quay/profiles.yml — L2 policy「何时用哪个 profile」（gap-profile-policy-when-which-profile）。
# 承载 L1 profiles/roles（抽层后的承载，⛔ 不再寄生 _launchSpec）+ L2 policy（主备回退 / 加载校验 / 继承去重）。
# schema 封闭（逐字段见 plugin/scripts/profile-policy.ts 的 ProfileSpec/RoleSpec），⛔ 不是配置项自由组合。
#
# 三条 policy 各自的落点：
#   ① 主备回退    fallbackModel：model 不可用时自动降级（SPEC §14① glm-5.3 只能人工回退的历史）。
#   ② 加载校验    auth：bare:true 要求 auth=key（ANTHROPIC_API_KEY）；auth=token 只给 ANTHROPIC_AUTH_TOKEN
#                 ⇒ 加载时被 profile-policy.ts validateProfiles 拒（SPEC §14② AC142 13/13 全败）。
#   ③ 继承去重    三个 worker role 只声明 name 差异，共享 worker-default（换模型改这一行，非三处）。
# ⚠️ `unset` 是「取消继承」的显式表达（等价于旧的 env 空串约定，见 quay-launch.sh:98）；`""` 语义由
#   mergeEnv 保留（manager 靠它取消 917k 三件套）。
version: 1

# ── flag-only 启动参数（对全部 role 生效；AC154 随 _launchSpec 一起移出 launch.settings.json）──
# 原 _launchSpec.excludeDynamicSystemPromptSections / _launchSpec.promptSuggestions 迁入——launch.settings.json
# 只留 Claude Code 认识的键（$schema/permissions/env），这些 flag-only 参数由 quay-launch.sh 翻译成 CLI 参数。
excludeDynamicSystemPromptSections: true
promptSuggestions: false
# deferredToPpMigration（原 _launchSpec 文档元数据，无代码消费，此处 YAML 注释保留语义）：待 -p 迁移决定后
# 追加的 flag —— --replay-user-messages（send-keys-reliable.sh 原生版本）/ --max-budget-usd（对冲 -p 只认
# API key 的计费风险）/ --forward-subagent-text（减少手工读 subagent jsonl）。

profiles:
  # 三个 worker role（task-worker / selector / fix-worker）+ outer 共享的 recipe。
  worker-default:
    launcher: claude-fjdac
    model: deepseek-v4-pro-anthropic
    bare: false
    auth: token            # claude-fjdac 只提供 ANTHROPIC_AUTH_TOKEN（并置空 ANTHROPIC_API_KEY）
    # ⚠️ gap-fix-worker-spawn-timeout-persists-post-fix（2026-09-07）更正上一轮
    #   gap-fix-worker-spawn-inherits-unrecognized-model-deepseek-v4-pro-anthropic 的「后缀不一致 ⇒ 超时」
    #   解释——该解释已被生产载体证否：对齐落地后 14 次 spawn 仍 12 次超时，且 unrecognized_model 警告
    #   在【干净返回与超时两类记录里都存在】（19 干净 + 59 超时都带它）⇒ 它是 query_source=sdk 的非致命
    #   装饰警告，不是超时成因（换 SDK 已知模型名跑同命令照样干净返回/干净报错，见任务体 ## Resolution）。
    #   真因 = fix-worker role 缺 CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS="0"（task-worker 有）。无此键时
    #   claude -p 保留「end_turn 时存活后台任务」的 600s 宽限期（gap-worker-print-bg-wait-ceiling-600s），
    #   而 promotion-driver 的 spawnSync timeout=180s ⇒ 600s > 180s，spawn 先超时（timedOut=true，
    #   exitCode=null），编辑其实已落盘（DIR-131）。修法 = roles.fix-worker.env 加该键。
    #   下面三个 DEFAULT_*_MODEL 对齐到带后缀值保留（无害、非成因），⛔ 勿再当超时修法。
    #   （旧文案：wrapper export 的不带后缀值与 model 不一致 ⇒ SDK 找不到 ⇒ 回退到无后缀到达 litellm。）
    env:
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-pro-anthropic
      ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro-anthropic
      ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro-anthropic
    # fallbackModel 缺省留空：当前无已知不可用的主 model。主备回退是 policy 能力（AC1），
    # 由 profile-policy.test.mjs 用合成配置验证（model=glm-5.3 + fallbackModel=deepseek-v4-pro）。
  # manager 用原生 claude + 默认模型，显式取消继承 917k 三件套（unset 显式化旧的空串约定）。
  manager-local:
    launcher: claude
    model: null
    bare: false
    auth: key              # 原生 claude 读 ANTHROPIC_API_KEY
    unset:
      - CLAUDE_CODE_MAX_CONTEXT_TOKENS
      - CLAUDE_CODE_AUTO_COMPACT_WINDOW
      - CLAUDE_AUTOCOMPACT_PCT_OVERRIDE

roles:
  manager:
    profile: manager-local
    name: quay-manager
  outer:
    profile: worker-default
    name: quay-outer
  task-worker:
    profile: worker-default
    name: quay-task-worker
    env:
      CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"    # 驱动的外部超时是唯一兜底（SPEC-worker-driven-inner §4④）
  selector:
    profile: worker-default
    name: quay-selector
  fix-worker:
    profile: worker-default
    name: quay-fix-worker
    env:
      CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"    # 同 task-worker：无此键 claude -p 有 600s end_turn 后台任务宽限 > 180s spawnSync 超时 ⇒ 恒 timedOut（gap-fix-worker-spawn-timeout-persists-post-fix）
  pool-judge:
    profile: worker-default
    name: quay-pool-judge
  # meta-driver v0：机制演进的观测/提案例程的语义半（plugin/probes/meta-driver.md）。
  # 短命 claude -p，每轮全新上下文——抗漂移靠这个，不靠提示词。
  meta-driver:
    profile: worker-default
    name: quay-meta-driver
