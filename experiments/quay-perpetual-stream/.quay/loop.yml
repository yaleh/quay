# .quay/loop.yml — quay-perpetual-stream (exp5) loop params (DIR-045).
#
# The loop-driver skill reads this file first; absent/malformed = FAIL-CLOSED.
# This is exp5's instance of the universal `iterate` contract — the SAME skill
# as archguard uses (archguard/.quay/loop.yml), differing ONLY in these params.
#
# board:  native provider (tasks/*.md in this repo's task store)
# gates:  it0-set alias stands for the DoD meta-enforcer gate set used by exp5's
#         outer loop (declared in this workspace's .quay/gates.yml — never in the skill)
# stop:   until(.halt) — exp5 runs perpetually until the .halt sentinel is placed
#         at experiments/quay-perpetual-stream/.halt (DIR-027 hygiene)
# policy: value-typed-ledger — exp5's own milestone-selection ranking
# coexist: RETIRED (DIR-050) — field removed from schema, silently ignored if present

board: native
gates: [it0-set]
stop: "until(.halt)"
policy: value-typed-ledger

# concurrency (DIR-049): max touches-disjoint batch width. Set to 2 by human directive.
# HONEST CAVEAT (same as routines below): exp5 is driven by the bespoke OUTER-LOOP.md, which
# does NOT read this key — so this is DECLARATIVE and INERT until OUTER-LOOP consumes it. And
# note DIR-049 explicitly holds that exp5's methodology milestones carry SELECT←ABSORB learning
# dependencies and are NOT concurrency-safe (unlike archguard's independent refactor tasks); if
# OUTER-LOOP is ever wired to honor this, batching MUST still respect that dependency (only
# genuinely touches-disjoint, learning-independent milestones may run in parallel).
concurrency: 2

# routines (DIR-051): the standing discovery track — the two most productive moves of
# this experiment made configurable. self-validation industrialises the fresh-context
# adversarial audit that found a real defect at EVERY recent milestone (DIR-052);
# architecture-analysis lights the L_G/L_D dark axes on quay's own code (DIR-053).
#
# HONEST STATUS (do not over-read this config): exp5 is driven by the BESPOKE
# experiments/quay-perpetual-stream/OUTER-LOOP.md, which does NOT yet read this file's
# routines: key (it predates DIR-045's loop.yml and consumes none of these params).
# So these entries are DECLARATIVE INTENT + the schema-valid config that DIR-052/053
# will consume once they teach OUTER-LOOP's checkpoint step to run routine-scheduler.mjs
# + dispatch the probe + file behind routine-file-gate.mjs. They are schema-validated by
# readLoopParams (so not malformed) but INERT under OUTER-LOOP until that wiring lands.
# The LIVE fire path today is archguard's loop.yml (portable skill already reads routines).
routines:
  - name: self-validation
    trigger: on(checkpoint)
    probe: self-validation
  - name: architecture-analysis
    trigger: on(checkpoint)
    probe: architecture-analysis
  - name: history-mining
    trigger: on(checkpoint)
    probe: history-mining
