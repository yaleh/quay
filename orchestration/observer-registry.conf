# observer-registry.conf — 观测者注册表（单一来源；本类机制的唯一登记面）
# =========================================================================
# 本文件是 gap-observer-registry-target-decommission-and-criterion-invalidation
# 的登记表：被下线的目标写一次在这里，所有观测者从同一处读，而不是各自维护一份
# 目标列表、各自手工编辑。已接入的消费者：os-anchor-watchdog / session-observation
# （git-staleness、session-observation-coverage 两个 Monitor 的读面）/ topology-check
# （session-topology Monitor 的读面）。
#
# 格式（| 分隔；'#' 开头或空行跳过）：
#   name|status|root|tmux-session|note
#     status: active | offline
#       offline = 已被显式登记下线/停用 —— 观测者必须报「已下线」，不得再报旧状态
#       （REPO-STALL / NOT-WATCHED / GONE / 陈旧拓扑缓存 / watchdog 复活）
#     root / tmux-session 供 `--audit` 重建各消费者读面；空或 '.' 解析为本仓库根
#
# 登记是读取类操作（AC5）：只有人/管理者显式执行
#   bash plugin/scripts/observer-registry.sh --register-offline <name> [--note "..."]
# （或 --register-active 反向），或手工编辑本文件。观测者从不自行猜下线。
#
# 触发（AC5）：本注册表不引入新的系统 crontab —— 观测者保留各自的既有触发
# （watchdog 的 systemd timer / 监视器自己的采样），只是每次读取时先查本表；
# `--audit` 与 sync-lag-check.sh 同款双触发源：tick 心跳必跑（见 plugin/loop/*.md）。
#
# 本类已知实例（2026-08-06 一晚四个；登记册见任务体）：
#   1 os-anchor-watchdog 复活已下线 archguard      2 git-staleness 持续报 REPO-STALL
#   3 session-observation-coverage 报 NOT-WATCHED      4 session-topology 报陈旧缓存
# -------------------------------------------------------------------------
quay|active|.|quay-0|本仓库（项目类）
meta-cc|active|$HOME/work/meta-cc|meta-cc|兄弟项目
archguard|active|$HOME/work/archguard|archguard|兄弟项目
