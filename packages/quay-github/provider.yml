# provider.yml — the GitHub Provider's static self-declaration
# (quay-proposal.md §10, QN-002's Plan/AC). Travels with the Provider.
#
# v1.5 (DIR-041, M57): read + full write (create + edit title/body/status/
# labels/parent/children) + gate (QN-028, iteration 17, primitive tasks;
# extended to compound/epic tasks QN-035, iteration 25, DIR-006) + skill
# (QN-029, iteration 18: status_skill_map/action_buttons, backed by the
# now-provider-parameterized quay:author/quay:execute Skills — see
# packages/quay-native/skills/{author,execute}/SKILL.md's iteration-18
# honesty notes; this was NOT free — it required fixing a real hardcoded-
# to-quay-native limitation in those Skills first, not just this file).
# Edit (title/body/labels/status/parent/children) landed across QN-024/
# M09-gh-write/M12-abi-parent-write; CREATE (a genuinely new issue via
# task_write id:"gh-new") was the one remaining write-surface gap, closed
# by DIR-041/M57 — see github-client.js's create()/CREATE_SENTINEL_ID and
# DESIGN.md §3.8.

id: github
name: "quay-github"
description: >
  GitHub Provider (v1.5, read + create + full edit + gate + skill): maps
  this repository's Issues onto the canonical task view-model (DESIGN.md).
  Second real backend, proves the ABI transfers to a heterogeneous store
  (proposal §14), and that the Skill layer itself transfers, not just the
  ABI surfaces.

capabilities:
  data.read: true    # task_list, task_get — required
  manifest: true     # this file / provider://manifest — required
  data.write: true   # QN-024 (iteration 10) added status-only write; M09-gh-write
                     # (title/body/labels) and M12-abi-parent-write (parent/
                     # children, via cross-issue body-checkbox mutation) closed
                     # the remaining EDIT-field write surface — Provider-ABI
                     # write coverage is 13/13 = 1.0000 as of M12's ABSORB
                     # (dashboard.md line 189). This comment previously
                     # (through M25) still read "title/body/labels/parent/
                     # children remain unimplemented", which M26-adversarial-
                     # eval's audit found stale and corrected here — see M26's
                     # audit-report.md finding M26-F1/ADV (both iterations
                     # independently found this).
                     # DIR-041 (M57) closed the one write surface that was
                     # STILL genuinely missing after M12/M26: CREATE (a brand
                     # new issue — task_write with id:"gh-new"). See
                     # github-client.js#writeFields/#writeRelations/#create for
                     # the actual implementations, DESIGN.md §3.8 for the
                     # CREATE-sentinel design rationale.
  gate: true          # QN-028 (iteration 17): task_check, primitive tasks;
                     # extended to compound/epic (children non-empty) tasks
                     # by QN-035 (iteration 25, DIR-006) via a ported,
                     # recursive childrenStatus() — live-verified against a
                     # real compound issue structure (gh-5/gh-6/gh-7) still
                     # present in this repo; see DESIGN.md §3.5/
                     # github-client.js#checkGate.
  skill: true         # QN-029 (iteration 18): status_skill_map/action_buttons
                     # declared below, backed by the provider-parameterized
                     # quay:author/quay:execute Skills (`quay task <cmd>
                     # --provider github`, Core's existing generic
                     # passthrough — zero Core-side code change).
                     # executeEpic's compound recursion against this
                     # Provider was itself live-verified by QN-035's own
                     # gh-7 lifecycle drive (iteration 25); no longer scoped
                     # to primitive tasks only, matching `gate` above.
  goal: false         # goals are NOT supported (stub: goal_list → [], goal_get/
                     # goal_write/goal_gate → isError "not supported") — no AC
                     # sub-record mapping on GitHub Issues (SPEC-goal-mechanism §5.4)

# status model (design §3) — same 4-state vocabulary as native; GitHub has
# no native status field, so this Provider derives status from issue.state
# + a status:* label convention (DESIGN.md §3).
statuses:
  - id: todo
    terminal: false
  - id: ready
    terminal: false
  - id: done
    terminal: true
  - id: "needs-human"
    terminal: true

# lane (design §5, proposal §7.1) — derived from a lane:* label; absent by
# default (v1: no lane labels applied to most issues in this repo yet).
lanes:
  - authoring
  - execution

# status -> Skill logical map (design §3), identical mapping to native's own
# (packages/quay-native/provider.yml) — same two Skills, now provider-
# parameterized (QN-029) so they genuinely operate against this Provider's
# own GitHub-backed data when invoked with provider: github.
status_skill_map:
  todo: "quay:author"
  ready: "quay:execute"

# action_buttons (proposal §6.4, §10; design §7) — identical shape to
# native's own. Core's composePayload (packages/quay/src/action.js) reads
# these fields generically per-Provider with zero Provider-specific
# branching — confirmed by reading that file in full (QN-029).
action_buttons:
  - id: advance
    label: "Advance"
    payload: "Drive task {{id}} forward one status transition using its current status's Skill (see status_skill_map)."
    whenStatus: ["todo", "ready"]

repo:
  owner: "yaleh"
  name: "quay"
  # QUAY_GITHUB_REPO env var overrides this at runtime (see bin/quay-github.ts).

# skills_path (QN-052, iteration 41): fixes a real, previously-undiscovered
# manifest asymmetry with native's own provider.yml, which declares
# skills_path: "./skills" alongside its own capabilities.skill: true. This
# Provider declared capabilities.skill: true (above) with no corresponding
# skills_path field at all. IMPORTANT — this field is documentary/
# declarative only (confirmed via `grep -rn skills_path packages/*/src/*.js`:
# zero consumers repo-wide, in either Provider or Core); it does NOT mean a
# duplicate packages/quay-github/skills/ directory exists, and none was
# created by this fix (that would be an unjustified, undemonstrated
# duplication of Skill content across Providers, not a real transfer proof —
# G5). The path below names the SAME two Skill files native's own
# skills_path already names (packages/quay-native/skills/author/SKILL.md,
# .../execute/SKILL.md) — this Provider's actual, already-working,
# already-credited (QN-029, iteration 18; QN-035, iteration 25) transfer
# mechanism is Core's provider-parameterized `quay task <cmd> --provider
# github` passthrough invoking those same physical files, not a
# per-Provider physical copy.
skills_path: "../quay-native/skills"

bin_entry: ["node", "./bin/quay-github.ts"]
mcp_entry: ["node", "./bin/quay-github.ts", "mcp"]
