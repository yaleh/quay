# plugin/scripts/drivers.yml — 声明式 driver 配置（git 版本化 · 人写 · 重启生效）。
# AC155 (gap-ac155-config-merge-control-state-split-event-polling)：并发 cap / 轮询间隔 / 协调地板 的单一真相源。
#
# ⛔ 与运行时控制态的分界（AC155 AC2）：控制态（.quay/worker-control.json / .quay/promotion-control.json）
# 是机器热写、gitignored，绝不并进本文件——机器改人的源文件 = CLAUDE.md 11b 同族（未提交改动正在影响生产、
# 一次 git checkout 就静默回退）。
#
# 消费方（单一加载入口）：plugin/scripts/driver-config.ts 的 loadDriverConfig / driverCap。
# 本文件取代旧的三份「单一真相源」：CAP_DEFAULT=5（promotion 字面量）/ resolveConcurrency（worker 读
# QUAY_MAX_TASK_SUBAGENTS env）/ FIXED_EFFECTIVE_CAP=5（cap-from-gate 字面量）。
version: 1

kinds:
  promotion:
    cap: 5               # 并发 cap（promotion 的 ready-pool --cap；AC48 后 cap 不闸晋升，仍参与 floor/disjointness）
    interval_ms: 30000   # 轮间隔（round heartbeat 节奏，SPEC §5.5 定时器地板）
  worker:
    # 并发 cap 单一真相源（gap-cap-from-gate-effective-cap-dual-source-blocks-yml-override）：
    # effective_cap（cap-from-gate）/ slot-refill --json 的 cap 均经 driverCap(root,"worker") 现读本字段，
    # 改本值会一致传导到运行时与测试（不再有「运行时读 yml / 测试读代码默认」的双来源分叉）。
    # 缺省 5 = DEFAULT_DRIVER_CAP（driver-config.ts 的回退值），非默认值时测试仍全绿。
    cap: 5               # 并发 cap（worker 常驻选择环的存活 worker 上限）
    interval_ms: 30000   # 无在飞 worker 且瞬时 WAIT 时的轮询间隔
    reconcile_interval_secs: 300  # 协调地板（SPEC §5.5：至少每 N 秒协调一次，边沿事件全丢也「慢但正确」而非静默停摆）
  outer:
    cap: 5               # ⛔ outer 例程型 kind 无并发概念（例程是「读→报」非「spawn 执行者」）；字段仅为齐整
    interval_ms: 30000   # 轮询节奏（= outer tick 例程的 round heartbeat；生产由 --interval 覆盖为 ~20min）
  quality:
    cap: 5               # ⛔ quality 例程型 kind 无并发概念（例程是「读→报」非「spawn 执行者」）；字段仅为齐整
    interval_ms: 30000   # 轮询节奏（B15/B17 两条例程的 round heartbeat；生产由 --interval 覆盖）
  meta:
    cap: 5               # ⛔ 同 quality：例程型 kind 无并发概念；字段仅为齐整
    interval_ms: 30000   # 循环滴答；meta 复核本身的节奏由 --review-interval（分钟）控制，
                         # 且语义半还要过变化检测闸 ⇒ 读数没变的轮不派 LLM
  goal:
    cap: 5               # ⛔ 同 meta：goal 机械环例程型 kind 无并发概念；字段仅为齐整
    interval_ms: 30000   # 循环滴答（每轮跑一遍 goal 机械环：跑 criterion→写 evidence→I2 flip→I3/I4）
    spawn_cap: 3         # G9 缺口语义环：每轮缺口立案 spawn 上限（读配置不写死，硬规则 4 推论二；
                         # goal-driver.goalSpawnCap 就地读此字段，⛔ 上收 driver-config 后应删该函数）
    gap_worker_timeout_ms: 900000  # G9 gap-filing agent spawn 超时（毫秒）——值由实测导出（⛔ 不拍脑袋，
                         # 硬规则 4 推论）：gap-filing 单次墙钟实测 elapsed_s=602.9（gap-goal-gap-filing-
                         # spawn-budget-too-small-ring-spins-empty 立案时的 900s 对照，exit=0），
                         # 900000（900s）> 602.9s 留 ~1.5x 余量。promotion fix-worker 保持 180s
                         # （400 轮 266/266 零超时）——两角色工作量不同，不再同值。
                         # goal-driver.goalGapWorkerTimeoutMs 就地读此字段（照 goalSpawnCap 接法）。
    # ── 被驱动系统（目标项目）绑定（gap-goal-driver-blind-to-driven-system-health）────────────
    # 本 driver 每轮额外产出一条 `goal-target-health` 读数（外部视角）：目标项目的 driver 进程数 /
    # round 心跳龄 / 窗口内 fan-in 成败分布 / 配置形状版本 / 关键载体存在性。
    # ⛔ 纯读数、**不参与任何判定**（不阻塞 goal 达成）；目标不可达/载体缺失 ⇒ not-evaluated（⛔ 不是 0）。
    # target_host 空/缺省 ⇒ 目标根在本机（直接本地读）；非空 ⇒ 经 ssh（BatchMode + ConnectTimeout）读。
    # ⛔ 值改动只在重启 goal driver 后生效（与其它 driver 配置同）。
    target_host: ad-arm1                       # 被驱动系统所在主机（ssh 目标；空 = 本机）
    target_root: /home/yale/work/archguard     # 被驱动系统（GOAL-016 靶子项目）根路径
    # ── CI run 载体的每轮采集（tasks/gap-develop-ci-first-decisive-green Requested action 2）──────
    # 本 driver 是 AC-265 的评估者，而 AC-265 读的是本地载体 `.quay/ci-runs.jsonl`；没有生产者时
    # 判据只能报 carrier-absent / collection-stalled，与「CI 真红」在读法上同形。这里就是那个生产者
    # 的调用点（采集器 capability-catalog 的 CADENCE 行声明「每轮」，此处兑现它）。
    # ⛔ 代码缺省是 false（见 goalCiRunsCollect）：这条读数会 spawn gh + 走网络，默认打开会让每个跑
    # runGoalRound 的测试都打真 API。生产「开」由**本真源显式置位**表达，⛔ 不是把代码默认改成 true。
    ci_runs_collect: true
    # 采集节流（毫秒）：gh 是外部配额资源，goal 轮间隔 30s ⇒ 不节流等于每分钟 2 次 API 调用。
    # 10 分钟 = 覆盖 AC-265 所需的时效（一次 CI run 实测 18–25 分钟）而不打爆配额。
    ci_runs_collect_throttle_ms: 600000

# ── routine 配额（gap-routine-quota-canonical-config-and-policy-gate）─────────────────────────────
# ⛔ 与 `kinds:` 平级，**不塞进某个 kind**——quota 是【按 routine 名】维度，不是按 driver kind 维度
# （一个 kind 下可能注册多条 routine）。本段是 routine 限流闸（routine-file-gate.ts）的
# K / 窗口 / 全局天花板 的【唯一声明式真相源】；消费方经 driver-config.ts 的 loadRoutineQuotaConfig /
# routineK / routineGlobalCeiling 读取（⛔ 不各写一份字面量）。
# ✅ 消费面已收敛（gap-routine-quota-consumer-convergence 完成）：两个真实生产调用点都在读本段——
# `probe-routine.ts` 的 `llmProbeRoutine`（routineK + routineGlobalCeiling ⇒ selectFilings ⇒
# routineQuotaDecision）与 `meta-driver.ts` 的 `driveItems`（routineGlobalCeiling + 载体全局读数 ⇒
# routineQuotaDecision）。本段是这两个 consumer 的真实生效源，⛔ 不再只是「配置面与纯 Policy 函数读取」。
routine_quota:
  window_ms: 86400000      # = 24h，与 routine-file-gate.ts 既有 FILING_WINDOW_MS 缺省值逐字一致（迁移兼容）
  default_k: 3             # 单 routine 缺省上限，与既有 DEFAULT_RATE 缺省值逐字一致（迁移兼容）
  # 新增：全部 routine 合计的硬上限。⚠️ 这是【人直接裁定的结构性要求】，⛔ 不是从事故阈值反推的实测值——
  # 本仓库迄今没有「K×R 失控」的事故读数（走该通道立案过任务的 routine 只有 2 个）。12 = default_k(3) ×
  # 迄今真实使用过该通道的 routine 数(2) × 安全余量(2)，是一个保守起始点，不是精调最优值。
  # 发生率为 0 ≠ 不需要：上限由人裁定直接要求，不走硬规则 12 的「新前置需发生率」路径。
  global_ceiling: 12
  per_routine: {}          # 可选：具名 routine 的 K 覆盖（缺省 = default_k）。空 map = 全部用缺省。
                           # ⛔ 不变式（由 routineK 结构性保证）：任何单 routine 的有效 K 不得大于 global_ceiling。
